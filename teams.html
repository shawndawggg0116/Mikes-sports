<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    .team.upcoming {
      background-color: #28a745; /* Bright green */
      color: white;
    }

    .team.ongoing {
      background-color: #ffc107; /* Yellow */
      box-shadow: 0 0 10px 2px yellow; /* Glow effect */
      color: black;
    }

    .team.completed {
      background-color: #6c757d; /* Grey */
      color: white;
      pointer-events: none;
      opacity: 0.7;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #007bff; /* Blue */
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teams = [
      'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals', 
      'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts', 
      'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings', 
      'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers', 
      'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
    ];

    let selectedTeam = null;
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    // Fetch the logged-in username
    fetch('/get-logged-in-user') // Fetch username dynamically from the server
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;

        // Fetch the user's picked teams from the server
        fetch(`/get-picked-teams?username=${data.username}`)
          .then(response => response.json())
          .then(data => {
            const pickedTeams = data.pickedTeams || []; // Array of teams already picked

            // Render teams
            teams.forEach(team => {
              const teamDiv = document.createElement('div');
              teamDiv.textContent = team;
              teamDiv.classList.add('team');

              // If the team is already picked, disable it
              if (pickedTeams.includes(team)) {
                teamDiv.classList.add('disabled');
              }

              teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled')) {
                  document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                  teamDiv.classList.add('selected');
                  selectedTeam = team;
                  submitButton.disabled = false;
                }
              });

              teamList.appendChild(teamDiv);
            });
          });
      })
      .catch(err => {
        console.error('Error fetching username:', err);
        alert('Error: Unable to fetch logged-in user.');
      });

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('disabled');
                selectedDiv.classList.remove('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });

    async function fetchGames() {
      try {
        const response = await fetch('/api/games');
        const data = await response.json();
        const now = new Date();

        data.games.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.textContent = `${game.homeTeam} vs ${game.awayTeam} - ${game.status}`;
          gameDiv.classList.add('team', game.status.toLowerCase());
          teamList.appendChild(gameDiv);
        });
      } catch (error) {
        console.error('Error fetching game data:', error);
      }
    }

    window.onload = fetchGames;
  </script>
</body>
</html>
