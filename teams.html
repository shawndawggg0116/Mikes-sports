<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .team.upcoming {
      background-color: #28a745 !important; /* Bright green */
    }

    .team.ongoing {
      background-color: #ffc107 !important; /* Yellow */
      box-shadow: 0 0 10px 2px yellow; /* Glow effect */
      color: black;
    }

    .team.completed {
      background-color: #6c757d !important; /* Grey */
      pointer-events: none;
      opacity: 0.7;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');

    async function fetchGames() {
      try {
        const response = await fetch('/api/games');
        if (!response.ok) throw new Error('Failed to fetch games.');

        const data = await response.json();

        data.games.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.textContent = `${game.homeTeam} vs ${game.awayTeam} - ${game.status}`;
          gameDiv.classList.add('team');

          // Add the correct status class
          const statusClass = game.status.toLowerCase();
          gameDiv.classList.add(statusClass);

          teamList.appendChild(gameDiv);
        });
      } catch (error) {
        console.error('Error fetching game data:', error);
      }
    }

    window.onload = fetchGames;
  </script>
</body>
</html>
