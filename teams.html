<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Team</title>
    <style>
        .team {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
        }

        .team.completed {
            background-color: gray;
            cursor: not-allowed;
        }

        .team.ongoing {
            background-color: orange;
        }

        .team.upcoming {
            background-color: blue;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .team-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Select Your Team</h1>
    </div>
    <div class="team-list" id="teamList">
        <!-- Teams will be dynamically rendered here -->
    </div>
    <button id="submitButton" disabled>Submit</button>

    <script>
        // Mock Data
        const teams = [
            { homeTeam: "Cardinals", awayTeam: "Bears", status: "Completed" },
            { homeTeam: "Jets", awayTeam: "Dolphins", status: "Completed" },
            { homeTeam: "Packers", awayTeam: "Vikings", status: "Ongoing" },
            { homeTeam: "Lions", awayTeam: "Giants", status: "Upcoming" }
        ];

        const teamList = document.getElementById('teamList');

        // Render Teams
        teams.forEach(game => {
            const div = document.createElement('div');
            div.className = `team ${game.status.toLowerCase()}`;
            div.textContent = `${game.homeTeam} vs ${game.awayTeam}`;
            if (game.status === "Completed") {
                div.style.cursor = "not-allowed";
            }
            teamList.appendChild(div);
        });

        // Enable Submit Button for Ongoing or Upcoming Teams
        const submitButton = document.getElementById('submitButton');
        const hasSelectableTeams = teams.some(game => game.status === "Ongoing" || game.status === "Upcoming");
        if (hasSelectableTeams) {
            submitButton.disabled = false;
        }
    </script>
</body>
</html>
