<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikes Sports</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Light gray background */
        }

        .link-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Spacing between boxes */
            text-align: center;
        }

        .link-box {
            background-color: #fff; /* White background for boxes */
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer; /* Style as clickable links */
            font-size: 20px; /* Large font size */
        }

        .link-box:hover {
            background-color: #e0e0e0; /* Slightly darker hover effect */
        }
    </style>
</head>
<body>
    <div class="link-container">
        <a href="/teams" class="link-box">Select Team</a>
        <a href="/leaderboard" class="link-box">Leaderboard</a>
        <a href="/rules" class="link-box">Rules</a>
    </div>
</body>
</html>
