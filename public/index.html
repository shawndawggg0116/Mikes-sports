<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks - Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #2c3e50; color: white; }
    .container { width: 300px; margin: auto; padding: 20px; border: 1px solid #f3efef; border-radius: 5px; background-color: #34495e; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background-color: green; color: white; border: none; cursor: pointer; }
    button:hover { background-color: darkgreen; }
    .error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
 

  <script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('error-message');

        errorMessage.textContent = ""; // Clear previous errors

        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        if (response.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('role', result.role); // Store role

            if (result.role === 'admin') {
                window.location.href = '/admin'; // Redirect admin to admin panel
            } else {
                window.location.href = '/teams'; // Redirect normal users to teams page
            }
        } else {
            errorMessage.textContent = result.message; // Show error message
        }
    }
</script>

    
  </script>
</body>
</html>
