<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks - Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #2c3e50; color: white; }
    .container { width: 300px; margin: auto; padding: 20px; border: 1px solid #f3efef; border-radius: 5px; background-color: #34495e; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background-color: green; color: white; border: none; cursor: pointer; }
    button:hover { background-color: darkgreen; }
    .error { color: red; margin-top: 10px; }
  </style>
  <link rel="manifest" href="/manifest.json">
  <!-- Apple touch icon meta tags -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120-precomposed.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
</head>
<script>
  function requestNotificationPermission() {
    Notification.requestPermission().then(permission => {
      console.log("Notification Permission:", permission);
      if (permission === "granted") {
        alert("✅ Notifications enabled!");
      } else if (permission === "denied") {
        alert("❌ Notifications blocked. Enable them in browser settings.");
      } else {
        alert("⚠️ Notification permission is still 'default'.");
      }
    }).catch(error => console.error("Error requesting permission:", error));
  }
</script>

<body>
  <button onclick="requestNotificationPermission()">Enable Notifications</button>


  <h1>NFL Picks - Login</h1>
  <!-- Image added here, before your login form -->
  <img src="/login-screen-image.png" alt="NFL Picks App Logo" style="width:200px; height:auto; display:block; margin:0 auto 20px;">
  <div class="container">
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');

      errorMessage.textContent = ""; // Clear previous errors

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json();

      if (response.ok) {
        localStorage.setItem('token', result.token); // Store token
        localStorage.setItem('username', result.username);
        localStorage.setItem('role', result.role); // Store user role

        // Redirect based on role
        if (result.role === "admin") {
          window.location.href = "/admin"; // Admins go to /admin
        } else {
          window.location.href = "/teams"; // Users go to /teams
        }
      } else {
        errorMessage.textContent = result.message; // Show error message
      }
    }
  </script>
</body>
</html>
