<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks - Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #2c3e50; color: white; }
    .container { width: 300px; margin: auto; padding: 20px; border: 1px solid #f3efef; border-radius: 5px; background-color: #34495e; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background-color: green; color: white; border: none; cursor: pointer; }
    button:hover { background-color: darkgreen; }
    .error { color: red; margin-top: 10px; }
  </style>
  <link rel="manifest" href="/manifest.json">
  <!-- Apple touch icon meta tags -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120-precomposed.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
</head>
<body>
  <h1>NFL Picks - Login</h1>
  <!-- Image added here, before your login form -->
  <img src="/login-screen-image.png" alt="NFL Picks App Logo" style="width:200px; height:auto; display:block; margin:0 auto 20px;">
  <div class="container">
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error-message"></p>
  </div>

  <button id="enableNotifications">Enable Notifications</button>

  <script>
      if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log("Service Worker Registered!", reg))
              .catch(err => console.log("Service Worker Error:", err));
      }
  
      document.getElementById('enableNotifications').addEventListener('click', async () => {
          if (!("Notification" in window)) {
              alert("This browser does not support notifications.");
              return;
          }
  
          const permission = await Notification.requestPermission();
          if (permission !== "granted") {
              alert("You need to allow notifications to receive reminders.");
              return;
          }
  
          // ✅ Subscribe to Push Notifications
          navigator.serviceWorker.ready.then(async reg => {
              const subscription = await reg.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: "BM66W9LQiC019-wki_kTmAU-6SLS..." // Use your actual public key
              });
  
              // ✅ Send subscription to the server
              await fetch("/api/subscribe", {
                  method: "POST",
                  body: JSON.stringify(subscription),
                  headers: {
                      "Content-Type": "application/json"
                  }
              });
  
              alert("Notifications enabled!");
          });
      });
  </script>
  

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');

      errorMessage.textContent = ""; // Clear previous errors

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json();

      if (response.ok) {
        localStorage.setItem('token', result.token); // Store token
        localStorage.setItem('username', result.username);
        localStorage.setItem('role', result.role); // Store user role

        // Redirect based on role
        if (result.role === "admin") {
          window.location.href = "/admin"; // Admins go to /admin
        } else {
          window.location.href = "/teams"; // Users go to /teams
        }
      } else {
        errorMessage.textContent = result.message; // Show error message
      }
    }
  </script>
</body>
</html>
