<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Schedule Scraper</title>
</head>
<body>
  <h1>Welcome to the NFL Schedule Scraper</h1>
  <button id="scrape">Scrape Schedule</button>
  <pre id="output"></pre>

  <script>
    document.getElementById('scrape').addEventListener('click', async () => {
      const response = await fetch('/scrape-schedule');
      if (response.ok) {
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } else {
        document.getElementById('output').textContent = 'Failed to scrape schedule.';
      }
    });
  </script>
</body>
</html>
