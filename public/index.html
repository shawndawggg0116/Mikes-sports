<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .welcome-container {
      margin-top: 100px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <h1>Welcome to NFL Team Pick App</h1>
    <button onclick="goToTeams()">Go</button>
  </div>
  <script>
    function goToTeams() {
      window.location.href = '/teams';
    }
  </script>
</body>
</html>
