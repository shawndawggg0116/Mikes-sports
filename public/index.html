<body>
  <button id="enableNotifications">Enable Notifications</button>

<script>
    document.getElementById('enableNotifications').addEventListener('click', async () => {
        if (!("Notification" in window)) {
            alert("This browser does not support notifications.");
            return;
        }

        const permission = await Notification.requestPermission();
        if (permission === "granted") {
            localStorage.setItem("notificationsEnabled", "true");
            alert("Notifications enabled!");
        } else {
            alert("You need to allow notifications to receive reminders.");
        }
    });

    // Function to send a notification
    function sendNotification() {
        if (localStorage.getItem("notificationsEnabled") === "true") {
            new Notification("🏈 NFL Picks Reminder", {
                body: "Don't forget to pick your team for this week!",
                icon: "/icon.png"
            });
        }
    }

  <h1>NFL Picks - Login</h1>
  <!-- Image added here, before your login form -->
  <img src="/login-screen-image.png" alt="NFL Picks App Logo" style="width:200px; height:auto; display:block; margin:0 auto 20px;">
  <div class="container">
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');

      errorMessage.textContent = ""; // Clear previous errors

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json();

      if (response.ok) {
        localStorage.setItem('token', result.token); // Store token
        localStorage.setItem('username', result.username);
        localStorage.setItem('role', result.role); // Store user role

        // Redirect based on role
        if (result.role === "admin") {
          window.location.href = "/admin"; // Admins go to /admin
        } else {
          window.location.href = "/teams"; // Users go to /teams
        }
      } else {
        errorMessage.textContent = result.message; // Show error message
      }
    }
  </script>
</body>
