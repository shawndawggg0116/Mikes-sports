<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js" crossorigin="anonymous"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .leaderboard-container {
            max-width: 90%;
            margin: 80px auto 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 20px;
            color: #f2a900;
            text-transform: uppercase;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #555;
            text-align: center;
        }

        th {
            background-color: #f2a900;
            color: black;
        }

        td {
            background-color: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .leaderboard-container {
                width: 100%;
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul>
            <li><a href="/teams">Teams</a></li>
            <li><a href="/leaderboard">Leaderboard</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/chat">Chat Room</a></li>
        </ul>
    </nav>

    <div class="leaderboard-container">
        <h1>NFL Weekly Leaderboard</h1>
        <label for="week-select">Select Week:</label>
        <select id="week-select" onchange="fetchLeaderboard()">
            <!-- Weeks will be dynamically inserted here -->
        </select>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Score</th>
                    <th>Selected Teams</th> <!-- Updated Column Name -->
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token'); // Get stored token

        if (!token) {
            window.location.href = '/'; // Redirect if not logged in
        }

        const authHeader = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        async function fetchLeaderboard() {
            const week = document.getElementById('week-select').value;
            try {
                const response = await fetch(`/api/leaderboard/${week}`, { headers: authHeader });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch leaderboard');
                }

                const data = await response.json();
                
                if (data.success && data.leaderboard) {
                    displayLeaderboard(data.leaderboard);
                } else {
                    throw new Error('Failed to load leaderboard data');
                }
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                alert('Failed to load leaderboard data.');
            }
        }

        function displayLeaderboard(users) {
    const leaderboardBody = document.getElementById('leaderboard-body');
    if (!leaderboardBody) {
        console.error("Error: leaderboardBody element not found in the DOM.");
        return;
    }

    leaderboardBody.innerHTML = ''; // Clear existing entries

    users.forEach((user, index) => {
        // Ensure picks is always treated as an array to avoid "undefined" errors
        const picks = Array.isArray(user.picks) ? user.picks : [];

        // Only display picked teams AFTER results are recorded (win/loss)
        const selectedTeams = picks
            .filter(pick => pick.result !== "pending") // Only show teams after results
            .map(pick => `${pick.team} (${pick.result})`)
            .join(', ') || 'No selection';

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${user.username}</td>
            <td>${user.totalScore !== undefined ? user.totalScore : 0}</td>
            <td>${selectedTeams}</td> <!-- Show picked teams after results -->
        `;

        leaderboardBody.appendChild(row);
    });
}


        function populateWeekSelector() {
            const currentWeek = moment().isoWeek();
            const select = document.getElementById('week-select');
            for (let i = 1; i <= currentWeek; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Week ${i}`;
                select.appendChild(option);
            }
            select.value = currentWeek; // Set to current week by default
            fetchLeaderboard(); // Fetch leaderboard for the current week initially
        }

        document.addEventListener('DOMContentLoaded', populateWeekSelector);
    </script>

</body>
</html>
