<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* General Page Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Leaderboard Container */
        .leaderboard-container {
            max-width: 90%;
            margin: 80px auto 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 20px;
            color: #f2a900;
            text-transform: uppercase;
            font-size: 28px;
        }

        /* Leaderboard Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #555;
            text-align: center;
        }

        th {
            background-color: #f2a900;
            color: black;
        }

        td {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            .leaderboard-container {
                width: 100%;
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="/teams">Teams</a></li>
            <li><a href="/leaderboard">Leaderboard</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/chat">Chat Room</a></li>
        </ul>
    </nav>

    <div class="leaderboard-container">
        <h1>NFL Weekly Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Score</th>
                    <th>Winning Teams of the Week</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token'); // Get stored token

        if (!token) {
            window.location.href = '/'; // Redirect if not logged in
        }

        const authHeader = `Bearer ${token}`;

        async function fetchLeaderboard() {
    const authHeader = `Bearer ${localStorage.getItem('token')}`; // Ensure you're using authentication tokens correctly

    try {
        const response = await fetch('/api/all-users-data', {
            method: 'GET',
            headers: { 'Authorization': authHeader }
        });

        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        if (data.success && data.users) {
            displayLeaderboard(data.users);
        } else {
            throw new Error('Failed to load users or no users found');
        }
    } catch (error) {
        console.error('Error fetching leaderboard:', error.message);
        alert('Failed to load leaderboard data.');
    }
}

function displayLeaderboard(users) {
    const leaderboardBody = document.getElementById('leaderboard-body');
    leaderboardBody.innerHTML = ''; // Clear existing entries

    users.forEach((user, index) => {
        const row = document.createElement('tr');
        const userPicks = user.winningPicks.map(pick => pick.team).join(', ');

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${user.username}</td>
            <td>${user.totalScore}</td>
            <td>${userPicks || 'No wins yet'}</td>
        `;

        leaderboardBody.appendChild(row);
    });
}

// Call fetchLeaderboard when the page loads or when needed
fetchLeaderboard();

    </script>

</body>
</html>
