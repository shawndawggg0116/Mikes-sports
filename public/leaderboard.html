<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="/teams">Teams</a></li>
            <li><a href="/leaderboard">Leaderboard</a></li>
            <li><a href="/rules">Rules</a></li>
        </ul>
    </nav>

    <div class="leaderboard-container">
        <h1>NFL Weekly Leaderboard</h1>
        <p>Current Week: <span id="week-number"></span></p>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Picked Team (Week <span id="week-header"></span>)</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token'); // Get stored token

        if (!token) {
            window.location.href = '/'; // Redirect if not logged in
        }

        const authHeader = `Bearer ${token}`;

        async function fetchLeaderboard() {
            try {
                // Fetch current week
                const weekResponse = await fetch('/api/current-week', {
                    headers: { 'Authorization': authHeader }
                });
                const { currentWeek } = await weekResponse.json();
                
                document.getElementById('week-number').textContent = currentWeek;
                document.getElementById('week-header').textContent = currentWeek;

                // Fetch leaderboard
                const response = await fetch('/api/leaderboard', {
                    headers: { 'Authorization': authHeader }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch leaderboard');
                }

                const users = await response.json();
                displayLeaderboard(users, currentWeek);
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
            }
        }

        function displayLeaderboard(users, currentWeek) {
            const leaderboardBody = document.getElementById('leaderboard-body');
            leaderboardBody.innerHTML = '';

            users.forEach((user, index) => {
                const pickedWeek = user.picks.find(p => p.week === currentWeek);
                const pickedTeam = pickedWeek ? pickedWeek.team : 'No Pick';
                const resultClass = pickedWeek ? getResultClass(pickedWeek.result) : '';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.username}</td>
                    <td class="picked-team ${resultClass}">${pickedTeam}</td>
                    <td>${user.totalScore}</td>
                `;

                leaderboardBody.appendChild(row);
            });
        }

        function getResultClass(result) {
            switch (result) {
                case 'win': return 'win-class';
                case 'loss': return 'loss-class';
                case 'pending': return 'pending-class';
                default: return '';
            }
        }

        fetchLeaderboard(); // Fetch leaderboard data on page load
        setInterval(fetchLeaderboard, 60000); // Refresh every minute
    </script>

</body>
</html>
