<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* General Page Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Leaderboard Container */
        .leaderboard-container {
            max-width: 90%;
            margin: 80px auto 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 20px;
            color: #f2a900;
            text-transform: uppercase;
            font-size: 28px;
        }

        /* Leaderboard Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #555;
            text-align: center;
        }

        th {
            background-color: #f2a900;
            color: black;
        }

        td {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            .leaderboard-container {
                width: 100%;
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="/teams">Teams</a></li>
            <li><a href="/leaderboard">Leaderboard</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/chat">Chat Room</a></li>
        </ul>
    </nav>

    <div class="leaderboard-container">
        <h1>NFL Weekly Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Score</th>
                    <th>Winning Teams of the Week</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token'); // Get stored token

        if (!token) {
            window.location.href = '/'; // Redirect if not logged in
        }

        const authHeader = `Bearer ${token}`;

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/all-users-data', {
                    headers: { 'Authorization': authHeader }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch leaderboard data');
                }

                const data = await response.json();
                if (!data.success || !data.users) {
                    throw new Error('No users found');
                }

                // Format the data for the leaderboard
                const formattedUsers = data.users.map(user => ({
                    username: user.username,
                    score: user.totalScore,
                    winningTeams: user.picks
                        .filter(pick => pick.result === 'win') // Filter only winning teams
                        .map(pick => pick.team) // Extract team names
                }));

                // Sort users by score in descending order
                formattedUsers.sort((a, b) => b.score - a.score);

                // Display the leaderboard
                displayLeaderboard(formattedUsers);
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                alert('Failed to load leaderboard data.');
            }
        }

        function displayLeaderboard(users) {
            const leaderboardBody = document.getElementById('leaderboard-body');
            leaderboardBody.innerHTML = ''; // Clear existing content

            users.forEach((user, index) => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.username}</td>
                    <td>${user.score}</td>
                    <td>${user.winningTeams.length > 0 ? user.winningTeams.join(', ') : 'No wins yet'}</td>
                `;

                leaderboardBody.appendChild(row);
            });
        }

        fetchLeaderboard(); // Fetch leaderboard data on page load
    </script>

</body>
</html>
