<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #4CAF50;
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 1em 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      padding: 0 20px;
      font-size: 1.2em;
    }

    .navbar a:hover {
      background-color: #3e8e41;
      padding: 0.5em 1.5em;
      border-radius: 5px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .team-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .team-buttons button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }

    .team-buttons button:disabled {
      background-color: #d9534f;
      cursor: not-allowed;
    }

    .team-buttons button.selected {
      background-color: #d9534f;
    }

    .submit-button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 1.2em;
      color: white;
      background-color: #4CAF50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .submit-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
  </div>

  <div class="container">
    <h1>Select Your Team</h1>
    <div class="team-buttons">
      <button onclick="selectTeam('49ers')" id="49ers">49ers</button>
      <button onclick="selectTeam('Cardinals')" id="Cardinals">Cardinals</button>
      <button onclick="selectTeam('Eagles')" id="Eagles">Eagles</button>
      <button onclick="selectTeam('Cowboys')" id="Cowboys">Cowboys</button>
      <!-- Add more teams as needed -->
    </div>

    <button class="submit-button" onclick="submitTeam()">Submit Team</button>
  </div>

  <script>
    let selectedTeam = null;

    function selectTeam(team) {
      if (selectedTeam) {
        document.getElementById(selectedTeam).classList.remove('selected');
      }
      selectedTeam = team;
      document.getElementById(team).classList.add('selected');
    }

    function submitTeam() {
      if (!selectedTeam) {
        alert('Please select a team before submitting.');
        return;
      }

      fetch('/select-team', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'shawn', team: selectedTeam })
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert(`You have selected ${selectedTeam}.`);
          } else {
            alert(data.message || 'An error occurred.');
          }
        })
        .catch(error => console.error('Error:', error));
    }
  </script>
</body>
</html>
