<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  
  <div id="user-picks"></div> <!-- User Picks Section -->
  <div class="team-container" id="teams"></div>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    async function loadUserPicks() {
      try {
        const response = await fetch('/api/user-picks', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const userData = await response.json();

        const userPicksContainer = document.getElementById('user-picks');
        userPicksContainer.innerHTML = `<h2>Your Picks:</h2>`;
        
        userData.pickedTeams.forEach((team, index) => {
          if (team) {
            const pickItem = document.createElement('p');
            pickItem.textContent = `Pick ${index + 1}: ${team}`;
            userPicksContainer.appendChild(pickItem);
          }
        });
      } catch (error) {
        console.error('Error loading user picks:', error);
      }
    }

    async function fetchTeams() {
      try {
        const teamsResponse = await fetch('/api/teams', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const userPicksResponse = await fetch('/api/user-picks', {
          headers: { Authorization: `Bearer ${token}` },
        });

        const teams = await teamsResponse.json();
        const userPicks = await userPicksResponse.json();
        
        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          box.className = `team-box ${getStatusClass(team.status)}`;
          box.textContent = `${team.homeTeam} vs ${team.awayTeam} (${team.status})`;

          // Disable already picked teams
          if (
            userPicks.pickedTeams.includes(team.homeTeam) ||
            userPicks.pickedTeams.includes(team.awayTeam) ||
            (team.status !== 'Available' && team.status !== 'Scheduled')
          ) {
            box.style.pointerEvents = 'none';
            box.style.opacity = '0.5';
          } else {
            box.addEventListener('click', () => pickTeam(team.homeTeam));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available': return 'green';
        case 'Playing': return 'orange';
        case 'Completed': return 'grey';
        default: return '';
      }
    }

    async function pickTeam(teamName) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ team: teamName }),
        });

        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
          loadUserPicks(); // Refresh user picks
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    }

    loadUserPicks();
    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
