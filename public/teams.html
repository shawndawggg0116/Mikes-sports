
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Selection</title>
  <style>
    .team {
      padding: 10px;
      margin: 5px;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
    .glowing {
      background-color: yellow;
      animation: glow 1s infinite;
    }
    .greyed-out {
      background-color: grey;
      color: white;
      pointer-events: none;
    }
    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    @keyframes glow {
      from { box-shadow: 0 0 10px yellow; }
      to { box-shadow: 0 0 20px orange; }
    }
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div id="team-list"></div>
  <script>
    async function fetchGameStatus() {
      const username = 'current-user'; // Replace with the logged-in user's name
      const response = await fetch(`/api/game-status?username=${username}`);
      const games = await response.json();

      const teamList = document.getElementById('team-list');
      teamList.innerHTML = '';

      games.forEach((game) => {
        const teamDiv = document.createElement('div');
        teamDiv.textContent = `${game.teamA} vs ${game.teamB || 'N/A'}`;
        teamDiv.className = `team ${game.status} ${game.disabled ? 'disabled' : ''}`;
        teamDiv.onclick = () => {
          if (!game.disabled) {
            alert(`You picked ${game.teamA}`);
          }
        };
        teamList.appendChild(teamDiv);
      });
    }

    setInterval(fetchGameStatus, 10000);
    fetchGameStatus();
  </script>
</body>
</html>
