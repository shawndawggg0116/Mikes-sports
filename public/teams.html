<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
    .team.available {
      background-color: #4caf50; /* Green */
    }
    .team.playing {
      background-color: yellow; /* Yellow */
      color: black;
      cursor: not-allowed;
    }
    .team.played {
      background-color: gray; /* Gray */
      cursor: not-allowed;
    }
    .team.selected {
      background-color: red; /* Red */
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teams = [
      'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals', 
      'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts', 
      'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings', 
      'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers', 
      'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
    ];

    let selectedTeam = null;
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    async function loadTeams() {
      try {
        const usernameResponse = await fetch('/get-logged-in-user');
        if (!usernameResponse.ok) throw new Error('Failed to fetch username.');

        const { username } = await usernameResponse.json();
        usernameField.value = username;

        const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
        if (!pickedTeamsResponse.ok) throw new Error('Failed to fetch picked teams.');

        const { pickedTeams } = await pickedTeamsResponse.json();

        const teamsResponse = await fetch('/nfl-teams');
        if (!teamsResponse.ok) throw new Error('Failed to fetch teams.');

        const teams = await teamsResponse.json();

        teams.forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;

          // Default class
          teamDiv.className = 'team available';

          // Check status and set classes
          if (pickedTeams.includes(team.teamName)) {
            teamDiv.className = 'team selected'; // Red: already picked by the user
          } else if (team.status === 'playing') {
            teamDiv.className = 'team playing'; // Yellow: currently playing
          } else if (team.status === 'played') {
            teamDiv.className = 'team played'; // Gray: already played
          }

          // Add click event for available teams
          if (team.status === 'available' && !pickedTeams.includes(team.teamName)) {
            teamDiv.addEventListener('click', () => {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              teamDiv.classList.add('selected');
              selectedTeam = team.teamName;
              submitButton.disabled = false;
            });
          } else {
            teamDiv.style.cursor = 'not-allowed'; // Make unclickable teams visually distinct
          }

          teamList.appendChild(teamDiv);
        });
      } catch (error) {
        console.error('Error loading teams:', error.message);
        alert('Error: Unable to load teams. Please try again later.');
      }
    }

    submitButton.addEventListener('click', async () => {
      if (!selectedTeam) return;

      try {
        const response = await fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameField.value, team: selectedTeam })
        });

        const data = await response.json();
        if (!data.success) throw new Error(data.message);

        alert(`You picked ${selectedTeam}`);
        const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent.includes(selectedTeam));
        if (selectedDiv) {
          selectedDiv.classList.add('selected');
          selectedDiv.classList.remove('available');
        }

        selectedTeam = null;
        submitButton.disabled = true;
      } catch (error) {
        console.error('Error submitting team:', error.message);
        alert('Error submitting your team. Please try again.');
      }
    });
    teams.forEach(team => {
  const teamDiv = document.createElement('div');
  teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;

  // Set classes based on status
  if (pickedTeams.includes(team.teamName)) {
    teamDiv.className = 'team selected'; // Red for picked teams
  } else if (team.status === 'playing') {
    teamDiv.className = 'team playing'; // Yellow for playing teams
  } else if (team.status === 'played') {
    teamDiv.className = 'team played'; // Gray for played teams
  } else {
    teamDiv.className = 'team available'; // Green for available teams
  }

  // Add click event for available teams
  if (team.status === 'available' && !pickedTeams.includes(team.teamName)) {
    teamDiv.addEventListener('click', () => {
      document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
      teamDiv.classList.add('selected');
      selectedTeam = team.teamName;
      submitButton.disabled = false;
    });
  } else {
    teamDiv.style.cursor = 'not-allowed'; // Make unclickable teams visually distinct
  }

  teamList.appendChild(teamDiv);
});

    loadTeams();
  </script>
</body>
</html>
