<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: red; /* User's picked team */
      color: white;
    }
    .team.disabled {
      background-color: grey; /* Completed games */
      color: white;
      cursor: not-allowed;
    }
    .team.picked {
      text-decoration: line-through; /* Line-through for picked teams */
    }
    .team.glowing {
      animation: glow 1s infinite alternate;
      background-color: #ffeb3b;
      color: black;
    }
    @keyframes glow {
      from {
        box-shadow: 0 0 5px #ffd700;
      }
      to {
        box-shadow: 0 0 20px #ffd700;
      }
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    // Fetch the logged-in user's username
    async function getLoggedInUser() {
      try {
        const response = await fetch('/get-logged-in-user');
        if (!response.ok) {
          throw new Error(`Error fetching logged-in user: ${response.statusText}`);
        }
        const data = await response.json();
        return data.username; // Return the username of the logged-in user
      } catch (error) {
        console.error('Error fetching logged-in user:', error);
        alert('Unable to fetch logged-in user. Please try again.');
        return null;
      }
    }

    // Fetch the user's picked teams
    async function getUserPicks(username) {
      try {
        const response = await fetch(`/api/user-picks/${username}`);
        if (!response.ok) {
          throw new Error(`Error fetching user picks: ${response.statusText}`);
        }
        const data = await response.json();
        if (data.success) {
          return data.pickedTeams;
        }
      } catch (error) {
        console.error('Error fetching user picks:', error);
      }
      return [];
    }

    // Fetch the list of teams
    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams');
        if (!response.ok) {
          throw new Error(`Error fetching teams: ${response.statusText}`);
        }
        return await response.json();
      } catch (error) {
        console.error('Error fetching teams:', error);
        return [];
      }
    }

    // Load teams and highlight user-picked teams
    async function loadTeams() {
      const username = await getLoggedInUser();
      if (!username) return;

      const pickedTeams = await getUserPicks(username);
      const teams = await fetchTeams();

      const teamList = document.querySelector('.team-list');
      teams.forEach(team => {
        const teamDiv = document.createElement('div');
        teamDiv.textContent = team;
        teamDiv.className = 'team';

        if (pickedTeams.includes(team)) {
          teamDiv.classList.add('picked'); // Add line-through for picked teams
          teamDiv.classList.add('disabled'); // Disable picked teams
        }

        teamDiv.addEventListener('click', () => {
          if (!teamDiv.classList.contains('disabled')) {
            document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
            teamDiv.classList.add('selected');
            document.getElementById('submitButton').disabled = false;
          }
        });

        teamList.appendChild(teamDiv);
      });
    }

    // Initialize the team list on page load
    document.addEventListener('DOMContentLoaded', loadTeams);

    // Handle team selection submission
    document.getElementById('submitButton').addEventListener('click', async () => {
      const selectedTeam = document.querySelector('.team.selected');
      const username = await getLoggedInUser();

      if (selectedTeam && username) {
        const team = selectedTeam.textContent;

        try {
          const response = await fetch('/select-team', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, team })
          });

          const data = await response.json();
          if (data.success) {
            alert(`You picked ${team}`);
            selectedTeam.classList.add('picked');
            selectedTeam.classList.add('disabled');
            selectedTeam.classList.remove('selected');
            document.getElementById('submitButton').disabled = true;
          } else {
            alert(data.message);
          }
        } catch (error) {
          console.error('Error submitting team pick:', error);
          alert('An error occurred. Please try again.');
        }
      }
    });
  </script>
</body>
</html>
