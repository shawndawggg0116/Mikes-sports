<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: grey !important;
      cursor: not-allowed;
    }
    .team.playing {
      background-color: yellow !important;
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(({ username }) => {
        document.getElementById('username').value = username;

        return fetch('/nfl-teams');
      })
      .then(response => response.json())
      .then(teams => {
        const teamList = document.querySelector('.team-list');
        const submitButton = document.getElementById('submitButton');

        teamList.innerHTML = ''; // Clear previous content

        teams.forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = `${team.teamName} (${team.wins}-${team.losses})`;
          teamDiv.classList.add('team');

          if (team.status === 'playing') {
            teamDiv.classList.add('playing', 'disabled');
          } else if (team.status === 'finished') {
            teamDiv.classList.add('disabled');
          }

          teamDiv.addEventListener('click', () => {
            if (!teamDiv.classList.contains('disabled')) {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              teamDiv.classList.add('selected');
              submitButton.disabled = false;
              submitButton.dataset.team = team.teamName;
            }
          });

          teamList.appendChild(teamDiv);
        });
      })
      .catch(error => console.error('Error fetching teams:', error));

    document.getElementById('submitButton').addEventListener('click', () => {
      const username = document.getElementById('username').value;
      const team = document.getElementById('submitButton').dataset.team;

      if (username && team) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${team}`);
              location.reload();
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
