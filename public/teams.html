<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      .team.live {
  background-color: #f39c12; /* A different color for live games */
  color: white;
  font-weight: bold;
  animation: glow 1s infinite alternate;
  position: relative;
}

@keyframes glow {
  from {
    box-shadow: 0 0 10px #f39c12;
  }
  to {
    box-shadow: 0 0 20px #e67e22;
  }
}

.team.live::after {
  content: "LIVE";
  color: white;
  background-color: red;
  font-size: 12px;
  font-weight: bold;
  padding: 2px 5px;
  border-radius: 5px;
  position: absolute;
  top: -10px;
  right: -10px;
}

    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
  const teamList = document.querySelector('.team-list');
  const submitButton = document.getElementById('submitButton');
  const usernameField = document.getElementById('username');
  let selectedTeam = null;

  try {
    // Fetch the logged-in username
    const usernameResponse = await fetch('/get-logged-in-user');
    const { username } = await usernameResponse.json();
    usernameField.value = username;

    // Fetch user's picked teams
    const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
    const { pickedTeams } = await pickedTeamsResponse.json();

    // Fetch NFL teams
    const teamsResponse = await fetch('/nfl-teams');
    const teams = await teamsResponse.json();

    // Render teams
    teams.forEach(team => {
      const teamDiv = document.createElement('div');
      teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
      teamDiv.classList.add('team');

      if (pickedTeams.includes(team.teamName)) {
        teamDiv.classList.add('disabled');
      }

      teamDiv.addEventListener('click', () => {
        if (!teamDiv.classList.contains('disabled')) {
          document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
          teamDiv.classList.add('selected');
          selectedTeam = team.teamName;
          submitButton.disabled = false;
        }
      });

      teamList.appendChild(teamDiv);
    });
  } catch (error) {
    console.error('Error loading teams:', error);
    alert('Failed to load teams. Please try again later.');
  }

  // Submit the selected team
  submitButton.addEventListener('click', async () => {
    if (selectedTeam) {
      try {
        const response = await fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameField.value, team: selectedTeam })
        });

        const result = await response.json();

        if (result.success) {
          alert(`You picked ${selectedTeam}`);
          location.reload(); // Reload the page to update the team list
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error submitting team:', error);
      }
    }
  });
});

    let selectedTeam = null;
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    // Fetch the logged-in username
    fetch('/get-logged-in-user') // Fetch username dynamically from the server
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;

        // Fetch the user's picked teams from the server
        fetch(`/get-picked-teams?username=${data.username}`)
          .then(response => response.json())
          .then(data => {
            const pickedTeams = data.pickedTeams || []; // Array of teams already picked

            // Render teams
            teams.forEach(team => {
              const teamDiv = document.createElement('div');
              teamDiv.textContent = team;
              teamDiv.classList.add('team');

              // If the team is already picked, disable it
              if (pickedTeams.includes(team)) {
                teamDiv.classList.add('disabled');
              }

              teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled')) {
                  document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                  teamDiv.classList.add('selected');
                  selectedTeam = team;
                  submitButton.disabled = false;
                }
              });

              teamList.appendChild(teamDiv);
            });
          });
      })
      .catch(err => {
        console.error('Error fetching username:', err);
        alert('Error: Unable to fetch logged-in user.');
      });

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('disabled');
                selectedDiv.classList.remove('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
    async function loadTeams() {
  try {
    const usernameResponse = await fetch('/get-logged-in-user');
    if (!usernameResponse.ok) throw new Error('Failed to fetch username.');

    const { username } = await usernameResponse.json();
    document.getElementById('username').value = username;

    const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
    if (!pickedTeamsResponse.ok) throw new Error('Failed to fetch picked teams.');

    const { pickedTeams } = await pickedTeamsResponse.json();
    const teamsResponse = await fetch('/nfl-teams');
    if (!teamsResponse.ok) throw new Error('Failed to fetch NFL teams.');

    const teams = await teamsResponse.json();

    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    teamList.innerHTML = ''; // Clear previous list

    teams.forEach(team => {
      const teamDiv = document.createElement('div');
      teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
      teamDiv.classList.add('team');

      // Apply styles based on game status
      if (team.gameStatus === 'completed' || pickedTeams.includes(team.teamName)) {
        teamDiv.classList.add('disabled');
      } else if (team.gameStatus === 'live') {
        teamDiv.classList.add('live'); // Add glowing effect for live games
      }

      teamDiv.addEventListener('click', () => {
        if (!teamDiv.classList.contains('disabled')) {
          document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
          teamDiv.classList.add('selected');
          submitButton.disabled = false;
          submitButton.dataset.team = team.teamName;
        }
      });

      teamList.appendChild(teamDiv);
    });
  } catch (error) {
    console.error('Error loading teams:', error);
    alert('Failed to load teams. Please try again later.');
  }
}

  </script>
</body>
</html>
