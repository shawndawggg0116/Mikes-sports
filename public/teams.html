<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
  .team.disabled {
    background-color: grey;
    cursor: not-allowed;
  }
  
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    async function loadTeams() {
      try {
        const usernameResponse = await fetch('/get-logged-in-user');
        if (!usernameResponse.ok) throw new Error('Failed to fetch username.');

        const { username } = await usernameResponse.json();
        document.getElementById('username').value = username;

        const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
        if (!pickedTeamsResponse.ok) throw new Error('Failed to fetch picked teams.');

        const { pickedTeams } = await pickedTeamsResponse.json();
        const teamsResponse = await fetch('/nfl-teams');
        if (!teamsResponse.ok) throw new Error('Failed to fetch NFL teams.');

        const teams = await teamsResponse.json();

        const teamList = document.querySelector('.team-list');
        const submitButton = document.getElementById('submitButton');

        teams.forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
          teamDiv.classList.add('team');

          if (pickedTeams.includes(team.teamName)) {
            teamDiv.classList.add('disabled');
          }

          teamDiv.addEventListener('click', () => {
            if (!teamDiv.classList.contains('disabled')) {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              teamDiv.classList.add('selected');
              submitButton.disabled = false;
              submitButton.dataset.team = team.teamName;
            }
          });

          teamList.appendChild(teamDiv);
        });
      } catch (error) {
        console.error('Error loading teams:', error);
        alert('Failed to load teams. Please try again later.');
      }
    }

    document.getElementById('submitButton').addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const team = document.getElementById('submitButton').dataset.team;

      if (username && team) {
        try {
          const response = await fetch('/select-team', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, team })
          });

          const result = await response.json();

          if (result.success) {
            alert(`You picked ${team}`);
            loadTeams();
          } else {
            alert(result.message);
          }
        } catch (error) {
          console.error('Error submitting team:', error);
        }
      }
    });
    document.addEventListener('DOMContentLoaded', async () => {
  const teamList = document.querySelector('.team-list');
  const submitButton = document.getElementById('submitButton');
  const usernameField = document.getElementById('username');
  let selectedTeam = null;

  try {
    const usernameResponse = await fetch('/get-logged-in-user');
    const { username } = await usernameResponse.json();
    usernameField.value = username;

    const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
    const { pickedTeams } = await pickedTeamsResponse.json();

    const teamsStatusResponse = await fetch('/nfl-game-status');
    const teamsStatus = await teamsStatusResponse.json();

    teamsStatus.forEach(team => {
      const teamDiv = document.createElement('div');
      teamDiv.textContent = team.team;
      teamDiv.classList.add('team');

      if (pickedTeams.includes(team.team) || team.status === 'played') {
        teamDiv.classList.add('disabled');
      } else if (team.status === 'inProgress') {
        teamDiv.style.backgroundColor = 'yellow';
        teamDiv.classList.add('disabled');
      }

      teamDiv.addEventListener('click', () => {
        if (!teamDiv.classList.contains('disabled')) {
          document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
          teamDiv.classList.add('selected');
          selectedTeam = team.team;
          submitButton.disabled = false;
        }
      });

      teamList.appendChild(teamDiv);
    });
  } catch (error) {
    console.error('Error loading teams:', error);
    alert('Failed to load teams. Please try again later.');
  }

  submitButton.addEventListener('click', async () => {
    if (!selectedTeam) return;

    try {
      const response = await fetch('/select-team', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameField.value, team: selectedTeam })
      });

      const data = await response.json();
      if (data.success) {
        alert(`You picked ${selectedTeam}`);
        location.reload();
      } else {
        alert(data.message);
      }
    } catch (error) {
      console.error('Error submitting team:', error);
    }
  });
});

    loadTeams();
  </script>
</body>
</html>
