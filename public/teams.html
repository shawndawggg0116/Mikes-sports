<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Teams</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; text-transform: capitalize; }
        .team-box.green { background-color: green; color: white; }
        .team-box.red { background-color: red; color: white; }
        .team-box.orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
        .team-box.grey { background-color: grey; color: white; }
        @keyframes flash {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Pick Your NFL Team</h1>
    <div class="team-container" id="teams"></div>
    <script>
        async function fetchTeams() {
            try {
                // Fetch all teams
                const response = await fetch('/api/teams');
                if (!response.ok) throw new Error('Failed to fetch teams');
                const teams = await response.json();

                // Fetch user's picked teams
                const userResponse = await fetch('/api/user-teams', { credentials: 'include' });
                if (!userResponse.ok) throw new Error('Failed to fetch user data');
                const userData = await userResponse.json();

                // Clear existing team boxes
                const container = document.getElementById('teams');
                container.innerHTML = '';

                // Render teams
                teams.forEach(team => {
                    const box = document.createElement('div');
                    box.className = 'team-box';
                    box.textContent = `${team.homeTeam} vs ${team.awayTeam}`;

                    // Validate dates
                    const now = new Date();
                    const startTime = new Date(team.startTime);
                    const endTime = new Date(team.endTime);

                    // Apply styles based on status
                    if (userData.pickedTeams.includes(team.homeTeam)) {
                        box.classList.add('red'); // Already picked
                    } else if (team.status === 'Completed' || now > endTime) {
                        box.classList.add('grey'); // Game finished
                    } else if (startTime <= now && now <= endTime) {
                        box.classList.add('orange'); // Game playing
                    } else {
                        box.classList.add('green'); // Available
                        box.addEventListener('click', () => pickTeam(team.homeTeam));
                    }

                    container.appendChild(box);
                });
            } catch (error) {
                console.error(error);
                alert('Unable to load teams. Please try again later.');
            }
        }

        async function pickTeam(team) {
            try {
                const response = await fetch('/api/pick-team', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ team }),
                    credentials: 'include'
                });
                const result = await response.json();
                if (result.success) {
                    alert('Team picked successfully!');
                    fetchTeams(); // Refresh the team list
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error(error);
                alert('Failed to pick the team. Please try again.');
            }
        }

        // Fetch teams every 60 seconds
        fetchTeams();
        setInterval(fetchTeams, 60000);
    </script>
</body>
</html>
