<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
    .team.available {
      background-color: #4caf50; /* Green */
    }
    .team.playing {
      background-color: yellow; /* Yellow */
      color: black;
      cursor: not-allowed;
    }
    .team.played {
      background-color: gray; /* Gray */
      cursor: not-allowed;
    }
    .team.selected {
      background-color: red; /* Red */
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div id="errorMessage" style="color: red; display: none;">Error loading teams. Please try again later.</div>
  <div class="team-list" id="teamList"></div>
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.getElementById('teamList');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');
    let selectedTeam = null;

    async function loadTeams() {
      try {
        const response = await fetch('/nfl-teams');
        if (!response.ok) throw new Error('Failed to fetch teams.');

        const teams = await response.json();
        if (teams.length === 0) throw new Error('No teams available.');

        teams.forEach(team => {
          const div = document.createElement('div');
          div.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
          div.className = `team ${team.status}`;

          if (team.status !== 'available') {
            div.classList.add('disabled');
          }

          div.onclick = () => {
            if (team.status === 'available') {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              div.classList.add('selected');
              selectedTeam = team.teamName;
              submitButton.disabled = false;
            }
          };

          teamList.appendChild(div);
        });
      } catch (error) {
        console.error('Error loading teams:', error.message);
        errorMessage.style.display = 'block';
      }
    }

    submitButton.addEventListener('click', async () => {
      if (!selectedTeam) return;

      try {
        const response = await fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: selectedTeam })
        });

        const data = await response.json();
        if (!data.success) throw new Error(data.message);

        alert(`You selected ${selectedTeam}.`);
        document.querySelectorAll('.team').forEach(t => {
          if (t.textContent.includes(selectedTeam)) {
            t.classList.remove('available');
            t.classList.add('selected');
          }
        });

        selectedTeam = null;
        submitButton.disabled = true;
      } catch (error) {
        console.error('Error submitting team:', error.message);
        alert('Error submitting your team. Please try again.');
      }
    });

    loadTeams();
  </script>
</body>
</html>
