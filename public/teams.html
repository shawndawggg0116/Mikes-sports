<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
    }
    .team-container { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 10px; 
    }
    .team-box { 
      padding: 20px; 
      border: 1px solid #0b0101; 
      border-radius: 5px; 
      text-transform: capitalize; 
      cursor: pointer; 
    }
    .team-box.playing { 
      background-color: orange; 
      color: white; 
      animation: flash 1s infinite alternate; 
    }
    .team-box.completed { 
      background-color: grey; 
      color: white; 
    }
    .team-box.available { 
      background-color: green; 
      color: white; 
    }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams-container"></div>
  <script>
    fetch('/api/teams')
      .then((response) => response.json())
      .then((teams) => {
        const container = document.getElementById('teams-container');
        container.innerHTML = ''; // Clear existing content

        teams.forEach((team) => {
          const button = document.createElement('button');

          // Construct the button label with team names and status
          button.textContent = `${team.homeTeam} Vs ${team.awayTeam} (${team.status})`;

          // Dynamically assign classes based on status
          if (team.status === 'Playing') {
            button.classList.add('playing');
          } else if (team.status === 'Completed') {
            button.classList.add('completed');
          } else if (team.status === 'Available') {
            button.classList.add('available');
            button.addEventListener('click', () => pickTeam(team.homeTeam));
          }

          container.appendChild(button);
        });
      })
      .catch((error) => console.error('Error fetching teams:', error));

    async function pickTeam(teamName) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: teamName }),
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          location.reload();
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    }
  </script>
</body>
</html>
