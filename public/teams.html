<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: red; /* User's picked team */
      color: white;
    }
    .team.disabled {
      background-color: grey; /* Completed games */
      color: white;
      cursor: not-allowed;
    }
    .team.glowing {
      animation: glow 1s infinite alternate;
      background-color: #ffeb3b;
      color: black;
    }
    @keyframes glow {
      from {
        box-shadow: 0 0 5px #ffd700;
      }
      to {
        box-shadow: 0 0 20px #ffd700;
      }
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    async function getUserPicks(userId) {
      try {
        const response = await fetch(`/api/user-picks/${userId}`);
        if (!response.ok) {
          throw new Error(`Error fetching user picks: ${response.statusText}`);
        }
        const data = await response.json();
        if (data.success) {
          return data.pickedTeams;
        }
      } catch (error) {
        console.error('Error fetching user picks:', error);
      }
      return [];
    }

    async function getLoggedInUser() {
      try {
        const response = await fetch('/get-logged-in-user');
        if (!response.ok) {
          throw new Error(`Error fetching logged-in user: ${response.statusText}`);
        }
        const data = await response.json();
        return data.username; // Return the username of the logged-in user
      } catch (error) {
        console.error('Error fetching logged-in user:', error);
        alert('Unable to fetch logged-in user. Please try again.');
        return null;
      }
    }

    async function loadTeams(userId) {
      const pickedTeams = await getUserPicks(userId);
      const response = await fetch('/api/game-status');
      const games = await response.json();

      games.forEach(game => {
        [game.teamA, game.teamB].forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = team;
          teamDiv.className = 'team';
          if (pickedTeams.includes(team)) {
            teamDiv.classList.add('disabled');
          }
          document.querySelector('.team-list').appendChild(teamDiv);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const username = await getLoggedInUser();
      if (username) {
        document.getElementById('username').value = username;
        loadTeams(username);
      }
    });

    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    let selectedTeam = null;

    submitButton.addEventListener('click', () => {
      const username = document.getElementById('username').value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
