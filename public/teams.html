<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Team Picker</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="team-container"></div>
  <button id="submit-btn" onclick="submitPick()">Submit</button>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    async function loadUserPicks() {
      const response = await fetch('/api/user-picks', {
        headers: { Authorization: `Bearer ${token}` },
      });
      return response.json();
    }

    async function renderTeams() {
      const teamsResponse = await fetch('/api/teams', {
        headers: { Authorization: `Bearer ${token}` },
      });
      const userResponse = await loadUserPicks();
      const teams = await teamsResponse.json();
      const userPicks = userResponse;
      const container = document.getElementById('team-container');
      container.innerHTML = '';

      teams.forEach((team) => {
        const box = document.createElement('div');
        box.className = `team-box ${getStatusClass(team.status)}`;
        box.textContent = `${team.homeTeam} vs ${team.awayTeam} (${team.status})`;

        if (userPicks.pickedTeams.includes(team.homeTeam) || userPicks.pickedTeams.includes(team.awayTeam) || (team.status !== 'Available' && team.status !== 'Scheduled')) {
          box.style.pointerEvents = 'none';
          box.style.opacity = '0.5';
        } else {
          box.addEventListener('click', async () => {
            const response = await fetch('/api/select-team', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ team: team.homeTeam }),
            });

            if (response.ok) {
              renderTeams();
            }
          });
        }
        container.appendChild(box);
      });
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available':
          return 'green';
        case 'Playing':
          return 'orange';
        case 'Completed':
          return 'grey';
        default:
          return '';
      }
    }

    async function submitPick() {
      const response = await fetch('/api/submit-pick', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
      });

      if (response.ok) {
        alert('Pick submitted successfully!');
        renderTeams();
      } else {
        const error = await response.json();
        alert(error.message);
      }
    }

    renderTeams();
    setInterval(renderTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
