<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    .team.playing {
      background-color: yellow;
      color: black;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    const allTeams = [
      'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals', 
      'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts', 
      'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings', 
      'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers', 
      'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
    ];

    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');
    let selectedTeam = null;

    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(userData => {
        usernameField.value = userData.username;

        // Fetch team statuses and render all 32 teams
        fetch('/get-nfl-teams-status')
          .then(response => response.json())
          .then(teamStatuses => {
            const statusMap = teamStatuses.reduce((acc, team) => {
              acc[team.name] = team.status;
              return acc;
            }, {});

            allTeams.forEach(teamName => {
              const teamDiv = document.createElement('div');
              teamDiv.textContent = teamName;
              teamDiv.classList.add('team');

              if (statusMap[teamName] === 'played') {
                teamDiv.classList.add('disabled');
              } else if (statusMap[teamName] === 'playing') {
                teamDiv.classList.add('playing');
              }

              teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled') && !teamDiv.classList.contains('playing')) {
                  document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                  teamDiv.classList.add('selected');
                  selectedTeam = teamName;
                  submitButton.disabled = false;
                }
              });

              teamList.appendChild(teamDiv);
            });
          })
          .catch(err => console.error('Error fetching team statuses:', err));
      })
      .catch(err => console.error('Error fetching logged-in user:', err));

    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              location.reload();
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
