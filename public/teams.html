<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: red; /* User's picked team */
      color: white;
    }
    .team.disabled {
      background-color: grey; /* Completed games */
      color: white;
      cursor: not-allowed;
    }
    .team.glowing {
      animation: glow 1s infinite alternate;
      background-color: #ffeb3b;
      color: black;
    }
    @keyframes glow {
      from {
        box-shadow: 0 0 5px #ffd700;
      }
      to {
        box-shadow: 0 0 20px #ffd700;
      }
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');
    let selectedTeam = null;
    let userPickedTeam = null;

    // Fetch all team schedules from schedules.js dynamically
    fetch('/api/game-status')
      .then(response => response.json())
      .then(schedules => {
        console.log('Schedules fetched:', schedules);

        fetch('/get-logged-in-user')
          .then(response => response.json())
          .then(userData => {
            usernameField.value = userData.username;
            userPickedTeam = userData.selectedTeam || null;

            schedules.forEach(game => {
              const teams = [game.teamA, game.teamB].filter(Boolean); // Filter out null values
              teams.forEach(team => {
                if (!team) return; // Skip null teams

                const teamDiv = document.createElement('div');
                teamDiv.textContent = team;
                teamDiv.classList.add('team');

                const now = new Date();
                if (userPickedTeam === team) {
                  teamDiv.classList.add('selected'); // User's picked team
                } else if (game.startTime && game.endTime) {
                  if (now > new Date(game.endTime)) {
                    teamDiv.classList.add('disabled'); // Completed game
                  } else if (now >= new Date(game.startTime) && now <= new Date(game.endTime)) {
                    teamDiv.classList.add('glowing'); // Game is live
                  }
                }

                teamDiv.addEventListener('click', () => {
                  if (!teamDiv.classList.contains('disabled')) {
                    document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                    teamDiv.classList.add('selected');
                    selectedTeam = team;
                    submitButton.disabled = false;
                  }
                });

                teamList.appendChild(teamDiv);
              });
            });
          })
          .catch(err => {
            console.error('Error fetching user data:', err);
            alert('Error: Unable to fetch user data.');
          });
      })
      .catch(err => console.error('Error fetching schedules:', err));

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
