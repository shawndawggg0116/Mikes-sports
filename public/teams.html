<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
    }
    .team {
      padding: 10px 20px;
      border-radius: 5px;
      margin: 5px;
      color: white;
      cursor: pointer;
    }
    .team.upcoming { background-color: #4caf50; } /* Green for upcoming games */
    .team.live { background-color: #007bff; } /* Blue for live games */
    .team.completed { background-color: grey; } /* Grey for completed games */
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div id="teamList"></div>
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.getElementById('teamList');
    const submitButton = document.getElementById('submitButton');
    let selectedTeam = null;

    // Fetch team statuses
    fetch('/teams')
      .then(response => response.json())
      .then(data => {
        const { teamStatuses } = data;

        for (const team in teamStatuses) {
          const status = teamStatuses[team];
          const div = document.createElement('div');
          div.textContent = team;
          div.className = `team ${status}`;

          // Handle click events
          if (status === 'upcoming') {
            div.addEventListener('click', () => {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              div.classList.add('selected');
              selectedTeam = team;
              submitButton.disabled = false;
            });
          }

          teamList.appendChild(div);
        }
      });

    // Submit team selection
    submitButton.addEventListener('click', () => {
      if (selectedTeam) {
        alert(`You selected: ${selectedTeam}`);
        // Add your POST request to save the team selection
      }
    });
  </script>
</body>
</html>
