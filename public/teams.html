<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .team-button {
      background-color: green;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .team-button:disabled {
      background-color: red;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div id="teams-container"></div>
  <script>
    const username = "shawn"; // Replace with the logged-in username dynamically

    async function fetchTeams() {
      const response = await fetch(`/api/user?username=${username}`);
      const user = await response.json();

      const teams = [
        "49ers", "Cardinals", "Eagles", "Cowboys", "Bears", "Ravens",
        "Steelers", "Seahawks", "Patriots", "Packers", "Jets", "Giants",
        "Buccaneers", "Texans", "Chargers", "Rams", "Chiefs", "Broncos",
        "Vikings", "Browns", "Lions", "Panthers", "Saints", "Dolphins",
        "Colts", "Jaguars", "Titans", "Bengals", "Bills", "Raiders", "Falcons",
        "Commanders"
      ];

      const container = document.getElementById('teams-container');
      container.innerHTML = '';

      teams.forEach(team => {
        const button = document.createElement('button');
        button.textContent = team;
        button.className = 'team-button';
        if (user.pickedTeams.includes(team)) {
          button.disabled = true;
        }
        button.addEventListener('click', () => pickTeam(team));
        container.appendChild(button);
      });
    }

    async function pickTeam(team) {
      const response = await fetch('/api/pick-team', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, team })
      });

      if (response.ok) {
        alert('Team picked successfully!');
        fetchTeams();
      } else {
        alert('Error picking team.');
      }
    }

    fetchTeams();
  </script>
</body>
</html>
