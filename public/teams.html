<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
    .team-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .team { padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: #fff; cursor: pointer; }
    .team.selected { background-color: red; color: white; }
    .team.live { background-color: orange; color: white; font-weight: bold; }
    .team.completed { background-color: gray; color: white; cursor: not-allowed; }
    button { margin-top: 20px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <button id="submitButton" disabled>Submit</button>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const teamList = document.querySelector('.team-list');
      const submitButton = document.getElementById('submitButton');
      let selectedTeam = null;
      const usernameResponse = await fetch('/get-logged-in-user');
      const { username } = await usernameResponse.json();
      const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
      const { pickedTeams } = await pickedTeamsResponse.json();
      const teamsResponse = await fetch('/nfl-teams');
      const teams = await teamsResponse.json();
      teams.forEach(team => {
        const teamDiv = document.createElement('div');
        teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
        teamDiv.classList.add('team', team.gameStatus);
        if (pickedTeams.includes(team.teamName) || team.gameStatus === 'completed') teamDiv.classList.add('completed');
        if (team.gameStatus === 'live') teamDiv.classList.add('live');
        teamDiv.addEventListener('click', () => {
          if (!teamDiv.classList.contains('completed')) {
            document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
            teamDiv.classList.add('selected');
            selectedTeam = team.teamName;
            submitButton.disabled = false;
          }
        });
        teamList.appendChild(teamDiv);
      });
      submitButton.addEventListener('click', async () => {
        await fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        });
        alert(`You selected ${selectedTeam}`);
        location.reload();
      });
    });
  </script>
</body>
</html>
