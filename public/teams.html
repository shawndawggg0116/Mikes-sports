<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams-with-picks', {
          headers: { Authorization: token },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          // Apply the correct class based on the team status and selection
          box.className = `team-box ${getStatusClass(team.status)} ${team.isPicked ? 'red' : ''}`;
          box.textContent = `${team.name} (${team.status}) ${team.isPicked ? ' - Picked' : ''}`;

          // Add click listener for "Available" or "Scheduled" teams
          if (!team.isPicked && (team.status === 'Available' || team.status === 'Scheduled')) {
            box.addEventListener('click', () => pickTeam(team._id)); // Use team._id here
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available': return 'green';
        case 'Playing': return 'orange';
        case 'Completed': return 'grey';
        default: return '';
      }
    }

    async function pickTeam(teamId) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            Authorization: token
          },
          body: JSON.stringify({ teamId }), // Send teamId to the server
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    }

    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
