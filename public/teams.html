<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    #submit-btn { margin-top: 20px; padding: 10px 20px; font-size: 16px; background-color: blue; color: white; border: none; cursor: pointer; border-radius: 5px; }
    #submit-btn:disabled { background-color: grey; cursor: not-allowed; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <button id="submit-btn" disabled>Submit</button>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    let selectedTeam = null;
    const submitBtn = document.getElementById("submit-btn");

    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams', {
          headers: { Authorization: token },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          box.className = `team-box ${getStatusClass(team.status)}`;
          box.textContent = `${team.name} (${team.status})`;

          if (team.status === 'Available' || team.status === 'Scheduled') {
            box.addEventListener('click', () => pickTeam(team.name, box));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available':
          return 'green';
        case 'Playing':
          return 'orange';
        case 'Completed':
          return 'grey';
        default:
          return '';
      }
    }

    function pickTeam(teamName, element) {
      document.querySelectorAll(".team-box").forEach(box => box.classList.remove("red"));
      element.classList.add("red");
      selectedTeam = teamName;
      submitBtn.disabled = false;
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedTeam) return;
      
      const userId = localStorage.getItem('userId'); // Ensure userId is stored in localStorage
      try {
        const response = await fetch('/api/select-team', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            Authorization: token
          },
          body: JSON.stringify({ userId, team: selectedTeam, week: 1 }), // Include userId and week
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
          selectedTeam = null;
          submitBtn.disabled = true;
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    });

    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
