<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Team</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .flashing {
            animation: flash 1s infinite;
        }
        @keyframes flash {
            0% { background-color: yellow; }
            50% { background-color: red; }
            100% { background-color: yellow; }
        }
        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .upcoming {
            background-color: green;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        h1 {
            color: #333;
        }
        .team-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .team {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
        }
        .team.selected {
            background-color: #007bff;
            color: white;
        }
        .team.disabled {
            background-color: red;
            cursor: not-allowed;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/teams" class="active">Team Selection</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/rules">Rules</a>
    </div>

    <h1>Select Your Team</h1>
    <div id="team-container" class="team-list"></div>
    <button id="submitButton" disabled>Submit</button>

    <script>
        const teamContainer = document.getElementById('team-container');
        const submitButton = document.getElementById('submitButton');
        const teams = ["Cardinals", "Bears", "Jets", "Dolphins", "Packers", "Vikings", "Lions", "Giants"];
        let selectedTeam = null;

        teams.forEach(team => {
            const teamDiv = document.createElement('div');
            teamDiv.textContent = team;
            teamDiv.id = team; // Add unique ID for status updates
            teamDiv.classList.add('team');

            teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled')) {
                    document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                    teamDiv.classList.add('selected');
                    selectedTeam = team;
                    submitButton.disabled = false;
                }
            });

            teamContainer.appendChild(teamDiv);
        });

        // Handle team submission
        submitButton.addEventListener('click', () => {
            if (selectedTeam) {
                alert(`You selected ${selectedTeam}`);
                const selectedDiv = document.getElementById(selectedTeam);
                if (selectedDiv) {
                    selectedDiv.classList.add('disabled');
                    selectedDiv.classList.remove('selected');
                }
                selectedTeam = null;
                submitButton.disabled = true;
            }
        });

        // Function to load and update game statuses
        async function loadGameStatuses() {
            try {
                const response = await fetch('/api/game-status');
                const games = await response.json();

                games.forEach(game => {
                    const homeTeamDiv = document.getElementById(game.homeTeam);
                    if (homeTeamDiv) {
                        homeTeamDiv.classList.remove('flashing', 'disabled', 'upcoming');
                        homeTeamDiv.classList.add(game.status);
                    }

                    const awayTeamDiv = document.getElementById(game.awayTeam);
                    if (awayTeamDiv) {
                        awayTeamDiv.classList.remove('flashing', 'disabled', 'upcoming');
                        awayTeamDiv.classList.add(game.status);
                    }
                });
            } catch (error) {
                console.error('Error loading game statuses:', error);
            }
        }

        // Initial load and periodic refresh every 30 seconds
        loadGameStatuses();
        setInterval(loadGameStatuses, 30000);
    </script>
</body>
</html>
