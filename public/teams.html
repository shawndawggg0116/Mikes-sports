<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Team Picks</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script> 
</head>
<body>
    <header>
        <h1>NFL Team Picks</h1>
        <nav>
            <a href="/">Home</a>

            <div class="team-container">

                <p>Bills</p>
            </div>
            <div class="team-container">

                <p>Panthers</p>
            </div>
            <div class="team-container">
                <img src="images/helmets/Bears.png" alt="Bears">

            </div>
            <div class="team-container">
                <img src="images/helmets/Bengals.png" alt="Bengals">

                <img src="images/helmets/Browns.png" alt="Browns">

            <div class="team-container">

            </div>
            <div class="team-container">

            </div>
            <div class="team-container">
                <img src="images/helmets/Packers.png" alt="Packers">

            </div>
            <div class="team-container">
                <img src="images/helmets/Texans.png" alt="Texans">
                <p>Texans</p>
            </div>
            <div class="team-container">
                <img src="images/helmets/Colts.png" alt="Colts">
                <p>Colts</p>
            </div>

    </div>
