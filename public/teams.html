
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Team</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="team-container"></div>

    <script>
        const teamContainer = document.getElementById('team-container');
        const teams = ["Cardinals", "Bears", "Jets", "Dolphins", "Packers", "Vikings", "Lions", "Giants"];
        const pickedTeams = []; // Replace with your data source

        teams.forEach(team => {
            const teamDiv = document.createElement('div');
            teamDiv.textContent = team;
            teamDiv.id = team; // Add unique ID for status updates
            teamDiv.classList.add('team');

            if (pickedTeams.includes(team)) {
                teamDiv.classList.add('disabled');
            }

            teamContainer.appendChild(teamDiv);
        });
    </script>
    <script src="gameStatus.js"></script>
</body>
</html>
