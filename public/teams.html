<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <style>
    /* Your CSS styles here */
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }

    .team.upcoming {
      background-color: green; 
    }

    .team.in-progress {
      background-color: orange;
      animation: flash 1s infinite;
    }

    .team.finished {
      background-color: gray;
    }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    // Fetch the logged-in username
    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;

        // Fetch the user's picked teams and last pick date from the server
        fetch(`/get-picked-teams?username=${data.username}`)
          .then(response => response.json())
          .then(data => {
            const pickedTeams = data.pickedTeams || []; // Array of teams already picked
            const lastPickDate = data.lastPickDate ? new Date(data.lastPickDate) : null;

            // Fetch available teams for the current week
            fetch('/get-available-teams') 
              .then(response => response.json())
              .then(gameData => {
                const games = gameData.games; 

                // Render teams with game status
                games.forEach(game => {
                  const teamDiv = document.createElement('div');
                  teamDiv.textContent = `${game.homeTeam} vs. ${game.awayTeam}`;
                  teamDiv.classList.add('team', game.status); // Add class based on status

                  // Disable team if already picked for the current week
                  if (pickedTeams.some(pick => pick.team === game.homeTeam || pick.team === game.awayTeam) || 
                      (lastPickDate && isThisWeek(lastPickDate))) { 
                    teamDiv.classList.add('disabled');
                  }

                  // ... (rest of the click event handling)

                  teamList.appendChild(teamDiv);
                });
              })
              .catch(err => {
                console.error('Error fetching available teams:', err);
                alert('Error: Unable to fetch available teams.');
              });
          })
          .catch(err => {
            console.error('Error fetching user data:', err);
            alert('Error: Unable to fetch user data.');
          });
      })
      .catch(err => {
        console.error('Error fetching username:', err);
        alert('Error: Unable to fetch logged-in user.');
      });

    // ... (rest of the script)
  </script>
</body>
</html>
