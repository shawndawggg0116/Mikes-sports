<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');
    let selectedTeam = null;

    // Fetch logged-in username
    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;

        // Fetch live schedule and picked teams
        fetch('/teams-schedule')
          .then(response => response.json())
          .then(scheduleData => {
            const { teamsWithStatus } = scheduleData;

            teamsWithStatus.forEach(team => {
              const teamDiv = document.createElement('div');
              teamDiv.textContent = `${team.homeTeam} vs ${team.awayTeam}`;
              teamDiv.classList.add('team');

              // Mark team status
              if (team.isLive) {
                teamDiv.style.backgroundColor = 'yellow';
              } else if (team.hasPlayed) {
                teamDiv.classList.add('disabled');
              }

              // Add selection behavior
              teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled')) {
                  document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                  teamDiv.classList.add('selected');
                  selectedTeam = team.homeTeam;
                  submitButton.disabled = false;
                }
              });

              teamList.appendChild(teamDiv);
            });
          });
      })
      .catch(err => {
        console.error('Error fetching user or schedule:', err);
        alert('Unable to fetch data.');
      });

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              document.querySelectorAll('.team').forEach(t => {
                if (t.textContent.includes(selectedTeam)) {
                  t.classList.add('disabled');
                  t.classList.remove('selected');
                }
              });
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          })
          .catch(err => console.error('Error submitting team:', err));
      }
    });
  </script>
</body>
</html>
