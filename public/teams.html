<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <style>
    /* Your CSS styles here */
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    // Fetch the logged-in username
    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;

        // Fetch the user's picked teams and last pick date from the server
        fetch(`/get-picked-teams?username=${data.username}`)
          .then(response => response.json())
          .then(data => {
            const pickedTeams = data.pickedTeams || []; // Array of teams already picked
            const lastPickDate = data.lastPickDate ? new Date(data.lastPickDate) : null;

            // Fetch available teams for the current week (replace with your actual API endpoint)
            fetch('/get-available-teams') 
              .then(response => response.json())
              .then(availableTeams => {
                // Render teams
                availableTeams.forEach(team => {
                  const teamDiv = document.createElement('div');
                  teamDiv.textContent = team;
                  teamDiv.classList.add('team');

                  // Disable team if already picked for the current week
                  if (pickedTeams.some(pick => pick.team === team)) { 
                    teamDiv.classList.add('disabled'); 
                  }

                  teamDiv.addEventListener('click', () => {
                    if (!teamDiv.classList.contains('disabled')) {
                      document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                      teamDiv.classList.add('selected');
                      selectedTeam = team;
                      submitButton.disabled = false;
                    }
                  });

                  teamList.appendChild(teamDiv);
                });
              })
              .catch(err => {
                console.error('Error fetching available teams:', err);
                alert('Error: Unable to fetch available teams.');
              });
          })
          .catch(err => {
            console.error('Error fetching user data:', err);
            alert('Error: Unable to fetch user data.');
          });
      })
      .catch(err => {
        console.error('Error fetching username:', err);
        alert('Error: Unable to fetch logged-in user.');
      });

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              // Update UI to reflect the new selection (e.g., disable the selected team)
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('disabled');
                selectedDiv.classList.remove('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
