<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    .team.glowing {
      animation: glow 1s infinite alternate;
      background-color: #ffeb3b;
      color: black;
    }
    @keyframes glow {
      from {
        box-shadow: 0 0 5px #ffd700;
      }
      to {
        box-shadow: 0 0 20px #ffd700;
      }
    }
    .team.greyed-out {
      color: grey;
      text-decoration: line-through;
      cursor: not-allowed;
    }
    .team.upcoming {
      font-weight: bold;
      color: green;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');
    let selectedTeam = null;

    // Fetch game statuses from the backend
    fetch('/api/game-status')
      .then(response => response.json())
      .then(games => {
        games.forEach(game => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = `${game.teamA} vs. ${game.teamB}`;
          teamDiv.classList.add('team', game.status);

          if (game.status === 'glowing' || game.status === 'greyed-out') {
            teamDiv.classList.add('disabled'); // Disable selection for glowing or greyed-out games
          }

          teamDiv.addEventListener('click', () => {
            if (!teamDiv.classList.contains('disabled')) {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              teamDiv.classList.add('selected');
              selectedTeam = game.teamA; // Set the selected team (can be adjusted as needed)
              submitButton.disabled = false;
            }
          });

          teamList.appendChild(teamDiv);
        });
      })
      .catch(err => console.error('Error fetching game statuses:', err));

    // Fetch the logged-in username
    fetch('/get-logged-in-user')
      .then(response => response.json())
      .then(data => {
        usernameField.value = data.username;
      })
      .catch(err => {
        console.error('Error fetching username:', err);
        alert('Error: Unable to fetch logged-in user.');
      });

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent.includes(selectedTeam));
              if (selectedDiv) {
                selectedDiv.classList.add('disabled');
                selectedDiv.classList.remove('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
