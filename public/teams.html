<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <h2>Your Picks</h2>
  <div id="user-picks"></div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams', {
          headers: { Authorization: token },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          box.className = `team-box ${getStatusClass(team.status)}`;
          box.textContent = `${team.name} (${team.status})`;

          if (team.status === 'Available' || team.status === 'Scheduled') {
            box.addEventListener('click', () => pickTeam(team.name));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    async function fetchUserPicks() {
      try {
        const response = await fetch('/api/user-picks', {
          headers: { Authorization: token },
        });
        const picks = await response.json();

        const userPicksContainer = document.getElementById('user-picks');
        userPicksContainer.innerHTML = '';

        picks.forEach((pick) => {
          const div = document.createElement('div');
          div.textContent = `Game: ${pick.gameId.homeTeamId.name} vs ${pick.gameId.awayTeamId.name}, Picked: ${pick.pickedTeamId.name}`;
          userPicksContainer.appendChild(div);
        });
      } catch (error) {
        console.error('Error fetching user picks:', error);
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available': return 'green';
        case 'Playing': return 'orange';
        case 'Completed': return 'grey';
        default: return '';
      }
    }

    async function pickTeam(teamName) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: token
          },
          body: JSON.stringify({ team: teamName }),
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
          fetchUserPicks();
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    }

    fetchTeams();
    fetchUserPicks();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
