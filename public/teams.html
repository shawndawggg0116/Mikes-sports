<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    .team { padding: 10px; margin: 10px; border: 1px solid #ccc; }
    .idle { background-color: #4caf50; color: white; }
    .playing { background-color: yellow; color: black; }
    .played { background-color: gray; color: white; }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div id="teamList"></div>

  <script>
    // Fetch NFL teams and render them
    fetch('/nfl-teams')
      .then(response => response.json())
      .then(data => {
        const teamList = document.getElementById('teamList');

        data.forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
          teamDiv.className = `team ${team.status}`;

          teamDiv.addEventListener('click', () => {
            alert(`You selected ${team.teamName}`);
          });

          teamList.appendChild(teamDiv);
        });
      })
      .catch(err => console.error('Error fetching teams:', err));
  </script>
</body>
</html>
