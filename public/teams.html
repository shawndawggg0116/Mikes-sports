<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; pointer-events: none; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <button id="submit" disabled>Submit</button>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    let selectedTeam = null;

    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams', {
          headers: { Authorization: token },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          box.className = `team-box ${getStatusClass(team.status)}`;
          box.textContent = `${team.name}`;

          if (team.status === 'Available') {
            box.addEventListener('click', () => selectTeam(team.name, box));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'Available':
          return 'green';
        case 'Picked':
          return 'red';
        case 'Playing':
          return 'orange';
        case 'Completed':
          return 'grey';
        default:
          return '';
      }
    }

    function selectTeam(teamName, box) {
      const previouslySelected = document.querySelector('.team-box.red');
      if (previouslySelected) {
        previouslySelected.classList.remove('red');
        previouslySelected.classList.add('green');
      }

      box.classList.remove('green');
      box.classList.add('red');
      selectedTeam = teamName;

      const submitButton = document.getElementById('submit');
      submitButton.disabled = false;
    }

    document.getElementById('submit').addEventListener('click', async () => {
      if (!selectedTeam) return;

      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: token
          },
          body: JSON.stringify({ teamName: selectedTeam }),
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    });

    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
