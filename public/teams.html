<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    let selectedTeam = null;

    try {
      // Fetch logged-in user
      const usernameResponse = await fetch('/get-logged-in-user');
      if (!usernameResponse.ok) throw new Error('Failed to fetch logged-in user');
      const { username } = await usernameResponse.json();

      // Fetch picked teams
      const pickedTeamsResponse = await fetch(`/get-picked-teams?username=${username}`);
      if (!pickedTeamsResponse.ok) throw new Error('Failed to fetch picked teams');
      const { pickedTeams } = await pickedTeamsResponse.json();

      // Fetch NFL teams
      const teamsResponse = await fetch('/nfl-teams');
      if (!teamsResponse.ok) throw new Error('Failed to fetch NFL teams');
      const teams = await teamsResponse.json();

      // Debugging: Log fetched teams
      console.log('Teams fetched:', teams);

      // Render teams
      teamList.innerHTML = ''; // Clear any existing content
      teams.forEach(team => {
        const teamDiv = document.createElement('div');
        teamDiv.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
        teamDiv.classList.add('team', team.gameStatus);

        if (pickedTeams.includes(team.teamName) || team.gameStatus === 'completed') {
          teamDiv.classList.add('completed');
        }
        if (team.gameStatus === 'live') {
          teamDiv.classList.add('live');
        }

        teamDiv.addEventListener('click', () => {
          if (!teamDiv.classList.contains('completed')) {
            document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
            teamDiv.classList.add('selected');
            selectedTeam = team.teamName;
            submitButton.disabled = false;
          }
        });

        teamList.appendChild(teamDiv);
      });
    } catch (error) {
      console.error('Error loading teams:', error);
      alert('Failed to load teams. Please try again later.');
    }

    // Submit team selection
    submitButton.addEventListener('click', async () => {
      if (selectedTeam) {
        try {
          const response = await fetch('/select-team', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, team: selectedTeam })
          });

          const result = await response.json();
          if (result.success) {
            alert(`You picked ${selectedTeam}`);
            location.reload();
          } else {
            alert(result.message);
          }
        } catch (error) {
          console.error('Error submitting team:', error);
        }
      }
    });
  });
</script>
