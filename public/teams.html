<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('/background/teamsbackground.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .team-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* Responsive grid */
      gap: 10px;
      padding: 10px;
    }

    .team-box {
      padding: 15px;
      border: 2px solid #ffffff; /* White border for contrast */
      border-radius: 10px;
      text-transform: capitalize;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .team-box:hover {
      transform: scale(1.05);
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.4);
    }

    /* Ensure contrast between text and background */
    .green {
      background-color: #008000;
      color: white;
    }

    .red {
      background-color: #ff0000;
      color: white;
    }

    .orange {
      background-color: #ffa500;
      color: white;
      animation: flash 1s infinite alternate;
    }

    .grey {
      background-color: #808080;
      color: white;
    }

    .picked {
      background-color: #b22222 !important;
      color: white !important;
      pointer-events: none;
      opacity: 0.9;
    }

    /* Adjust submit button */
    #submit-btn {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background-color: grey;
      color: white;
      cursor: not-allowed;
      transition: background 0.3s;
    }

    #submit-btn.active {
      background-color: blue;
      cursor: pointer;
    }

    /* Flashing effect for "Playing" status */
    @keyframes flash {
      0% {
        opacity: 0.5;
      }
      100% {
        opacity: 1;
      }
    }

    /* Make the grid responsive */
    @media (max-width: 768px) {
      .team-container {
        grid-template-columns: repeat(2, 1fr); /* 2 columns on smaller screens */
      }
    }

    @media (max-width: 480px) {
      .team-container {
        grid-template-columns: repeat(1, 1fr); /* 1 column on very small screens */
      }
    }

    

  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <ul>
        <li><a href="/teams">Teams</a></li>
        <li><a href="/leaderboard">Leaderboard</a></li>
        <li><a href="/rules">Rules</a></li>
        <li><a href="/chat">Chat Room</a></li>
    </ul>
</nav>


  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <button id="submit-btn" disabled>Submit Pick</button>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }
    const authHeader = `Bearer ${token}`;

    let selectedTeam = null;

    async function fetchTeams() {
      try {
        // Fetch user data
        const userResponse = await fetch('/api/get-user', {
          headers: { 'Authorization': authHeader },
        });
        const userData = await userResponse.json();
        const pickedTeams = userData.pickedTeams || [];

        // Fetch teams
        const response = await fetch('/api/teams', {
          headers: { 'Authorization': authHeader },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          const isPicked = pickedTeams.includes(team.name);

          box.className = `team-box ${getStatusClass(team.status, isPicked)}`;
          box.textContent = `${team.name} (${team.status})`;

          // Add "picked" logic
          if (isPicked) {
            box.classList.add('picked');
          } else if (team.status === 'Available' || team.status === 'Scheduled') {
            box.addEventListener('click', () => selectTeam(team.name, box));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    function getStatusClass(status, isPicked) {
      if (isPicked) return 'picked';
      switch (status) {
        case 'Available': return 'green';
        case 'Playing': return 'orange';
        case 'Completed': return 'grey';
        case 'Scheduled': return 'green'; // Adjusted as per "scheduled"
        default: return '';
      }
    }

    function selectTeam(teamName, box) {
      selectedTeam = teamName;
      document.querySelectorAll('.team-box').forEach((box) => box.classList.remove('red'));
      box.classList.add('red');
      document.getElementById('submit-btn').classList.add('active');
      document.getElementById('submit-btn').disabled = false;
    }

    document.getElementById('submit-btn').addEventListener('click', async () => {
      if (!selectedTeam) return;
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': authHeader,
          },
          body: JSON.stringify({ team: selectedTeam }),
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
          selectedTeam = null;
          document.getElementById('submit-btn').classList.remove('active');
          document.getElementById('submit-btn').disabled = true;
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    });


    
    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
