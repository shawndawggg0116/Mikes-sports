<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <script>
    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams');
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const teams = await response.json();
        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          const status = team.status.toLowerCase();
          box.className = `team-box ${status}`;
          box.textContent = `${team.homeTeam} vs ${team.awayTeam} (${team.status})`;

          if (status === 'available') {
            box.addEventListener('click', () => pickTeam(team.homeTeam));
            box.title = 'Click to pick this team';
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
        alert('Failed to load teams. Please try again later.');
      }
    }

    async function pickTeam(teamName) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: teamName }),
        });
        const result = await response.json();

        if (response.ok && result.success) {
          alert('Team picked successfully!');
          fetchTeams();
        } else {
          alert(result.message || 'Failed to pick the team.');
        }
      } catch (error) {
        console.error('Error picking team:', error);
        alert('An error occurred. Please try again.');
      }
    }

    fetchTeams();

    // Ensure only one fetch at a time
    let isFetching = false;
    setInterval(async () => {
      if (!isFetching) {
        isFetching = true;
        await fetchTeams();
        isFetching = false;
      }
    }, 60000);
  </script>
</body>
</html>
