<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Teams</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .team-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .team-box { padding: 20px; border: 1px solid #ccc; border-radius: 5px; text-transform: capitalize; cursor: pointer; }
    .green { background-color: green; color: white; }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: white; animation: flash 1s infinite alternate; }
    .grey { background-color: grey; color: white; }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pick Your NFL Team</h1>
  <div class="team-container" id="teams"></div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect to login if not logged in
    }

    async function displayUserPicks() {
  const token = localStorage.getItem('token');
  if (!token) {
    return; // User is not logged in
  }

  try {
    const response = await fetch('/api/user-picks', {
      headers: { Authorization: `Bearer ${token}` },
    });

    const data = await response.json();
    const picksContainer = document.createElement('div');
    picksContainer.id = 'user-picks';
    picksContainer.innerHTML = `<h3>Your Picks:</h3><ul>${data.pickedTeams
      .filter(Boolean) // Filter out null or empty picks
      .map((team) => `<li>${team}</li>`)
      .join('')}</ul>`;

    document.body.insertBefore(picksContainer, document.getElementById('teams'));
  } catch (error) {
    console.error('Error fetching user picks:', error);
  }
}

// Call the function after loading teams
displayUserPicks();


    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams', {
          headers: { Authorization: token },
        });
        const teams = await response.json();

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach((team) => {
          const box = document.createElement('div');
          // Apply the correct class based on the team status
          box.className = `team-box ${getStatusClass(team.status)}`;
          box.textContent = `${team.name} (${team.status})`;

          // Add click listener for "Available" or "Scheduled" teams
          if (team.status === 'Available' || team.status === 'Scheduled') {
            box.addEventListener('click', () => pickTeam(team.name));
          }

          container.appendChild(box);
        });
      } catch (error) {
        console.error('Error fetching teams:', error);
      }
    }

    // Function to return the correct class for the status
    function getStatusClass(status) {
      switch (status) {
        case 'Available':
          return 'green';
        case 'Playing':
          return 'orange';
        case 'Completed':
          return 'grey';
        default:
          return '';
      }
    }

    function getStatusClass(status) {
  switch (status) {
    case 'Available':
      return 'green';
    case 'Scheduled':
      return 'darkgreen';
    case 'Playing':
      return 'orange';
    case 'Completed':
      return 'grey';
    case 'Picked':
      return 'blue'; // Add a blue color for picked teams (you can customize this)
    default:
      return '';
  }
}


    async function pickTeam(teamName) {
      try {
        const response = await fetch('/api/pick-team', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            Authorization: token
          },
          body: JSON.stringify({ team: teamName }),
        });
        const result = await response.json();
        if (result.success) {
          alert('Team picked successfully!');
          fetchTeams();
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error('Error picking team:', error);
      }
    }

    fetchTeams();
    setInterval(fetchTeams, 60000); // Refresh every minute
  </script>
</body>
</html>
