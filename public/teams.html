<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: grey;
      cursor: not-allowed;
    }
    .team.live {
      border: 2px solid gold;
      box-shadow: 0 0 10px gold;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const teams = [
      'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals',
      'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts',
      'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings',
      'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers',
      'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
    ];

    let selectedTeam = null;
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');

    // Fetch the current schedule
    async function fetchSchedule() {
      try {
        const scheduleResponse = await fetch('/current-schedule');
        const scheduleData = await scheduleResponse.json();
        const now = new Date();

        renderTeams(scheduleData.games, now);
      } catch (err) {
        console.error('Error fetching schedule:', err);
        alert('Error: Unable to load schedule data.');
      }
    }

    // Render the team buttons
    function renderTeams(games, now) {
      teams.forEach(team => {
        const teamDiv = document.createElement('div');
        teamDiv.textContent = team;
        teamDiv.classList.add('team');

        // Find the game's status
        const game = games.find(g => g.homeTeam === team || g.awayTeam === team);
        if (game) {
          const gameTime = new Date(`${game.date}T${game.time}`);
          const gameEnd = new Date(gameTime.getTime() + 3 * 60 * 60 * 1000); // 3-hour game duration

          if (now > gameEnd) {
            // Grey out for completed games
            teamDiv.classList.add('disabled');
            teamDiv.textContent += ' (Completed)';
          } else if (now >= gameTime && now <= gameEnd) {
            // Highlight for live games
            teamDiv.classList.add('live');
            teamDiv.textContent += ' (Live)';
          }
        }

        teamDiv.addEventListener('click', () => {
          if (!teamDiv.classList.contains('disabled') && !teamDiv.classList.contains('live')) {
            document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
            teamDiv.classList.add('selected');
            selectedTeam = team;
            submitButton.disabled = false;
          }
        });

        teamList.appendChild(teamDiv);
      });
    }

    // Submit the selected team
    submitButton.addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      if (selectedTeam && username) {
        try {
          const response = await fetch('/select-team', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, team: selectedTeam })
          });

          const data = await response.json();
          if (data.success) {
            alert(`You picked ${selectedTeam}`);
            const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent.includes(selectedTeam));
            if (selectedDiv) {
              selectedDiv.classList.add('disabled');
              selectedDiv.classList.remove('selected');
            }
            selectedTeam = null;
            submitButton.disabled = true;
          } else {
            alert(data.message);
          }
        } catch (error) {
          console.error('Error selecting team:', error);
        }
      }
    });

    fetchSchedule();
  </script>
</body>
</html>
