<script>
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = '/';
  }
  const authHeader = `Bearer ${token}`;
  let selectedTeam = null;

  async function fetchTeams() {
    try {
      const userResponse = await fetch('/api/get-user', { headers: { 'Authorization': authHeader } });
      const userData = await userResponse.json();
      const pickedTeams = userData.picks ? Object.values(userData.picks).map(pick => pick.team) : [];

      const response = await fetch('/api/teams', { headers: { 'Authorization': authHeader } });
      const teams = await response.json();

      const container = document.getElementById('teams');
      container.innerHTML = '';

      teams.forEach((team) => {
        const box = document.createElement('div');
        const isPicked = pickedTeams.includes(team.name);

        box.className = `team-box ${getStatusClass(team.status, isPicked)}`;
        box.textContent = `${team.name} (${team.status})`;

        if (isPicked) {
          box.classList.add('picked');
        } else if (team.status === 'Available' || team.status === 'Scheduled') {
          box.addEventListener('click', () => selectTeam(team.name, box));
        }

        container.appendChild(box);
      });
    } catch (error) {
      console.error('Error fetching teams:', error);
    }
  }

  function getStatusClass(status, isPicked) {
    if (isPicked) return 'picked';
    switch (status) {
      case 'Available': return 'green';
      case 'Playing': return 'orange';
      case 'Completed': return 'grey';
      case 'Scheduled': return 'green';
      default: return '';
    }
  }

  function selectTeam(teamName, box) {
    selectedTeam = teamName;
    document.querySelectorAll('.team-box').forEach((box) => box.classList.remove('red'));
    box.classList.add('red');
    document.getElementById('submit-btn').classList.add('active');
    document.getElementById('submit-btn').disabled = false;
  }

  document.getElementById('submit-btn').addEventListener('click', async () => {
    if (!selectedTeam) return;
    try {
      const response = await fetch('/api/pick-team', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': authHeader,
        },
        body: JSON.stringify({ team: selectedTeam }),
      });
      const result = await response.json();
      if (result.success) {
        alert('Team picked successfully!');
        fetchTeams();
        selectedTeam = null;
        document.getElementById('submit-btn').classList.remove('active');
        document.getElementById('submit-btn').disabled = true;
      } else {
        alert(result.message);
      }
    } catch (error) {
      console.error('Error picking team:', error);
    }
  });

  fetchTeams();
  setInterval(fetchTeams, 60000);
</script>
