<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: red; /* User's selected team */
      color: white;
    }
    .team.disabled {
      background-color: grey; /* Completed games */
      color: white;
      cursor: not-allowed;
    }
    .team.upcoming {
      font-weight: bold;
      color: green;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value=""> <!-- This will be filled dynamically -->
  <button id="submitButton" disabled>Submit</button>

  <script>
    const allTeams = [
      'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals', 
      'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts', 
      'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings', 
      'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers', 
      'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
    ];
    
    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');
    let selectedTeam = null;
    let userPickedTeam = null; // Track user's picked team

    // Fetch game schedules and user data dynamically
    fetch('/api/game-status')
      .then(response => response.json())
      .then(games => {
        console.log('Schedules fetched:', games); // Debugging log

        fetch('/get-logged-in-user')
          .then(response => response.json())
          .then(userData => {
            usernameField.value = userData.username;
            userPickedTeam = userData.selectedTeam || null;

            // Display all teams
            allTeams.forEach(team => {
              const teamDiv = document.createElement('div');
              teamDiv.textContent = team;
              teamDiv.classList.add('team');

              // Find the game related to this team
              const game = games.find(g => g.teamA === team || g.teamB === team);

              // Apply styles based on game and user status
              if (game) {
                const now = new Date();
                if (now > new Date(game.endTime)) {
                  teamDiv.classList.add('disabled'); // Completed game
                } else if (userPickedTeam === team) {
                  teamDiv.classList.add('selected'); // User's picked team
                }
              }

              // Add click functionality for selection
              teamDiv.addEventListener('click', () => {
                if (!teamDiv.classList.contains('disabled')) {
                  document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
                  teamDiv.classList.add('selected');
                  selectedTeam = team;
                  submitButton.disabled = false;
                }
              });

              teamList.appendChild(teamDiv);
            });
          })
          .catch(err => {
            console.error('Error fetching user data:', err);
            alert('Error: Unable to fetch user data.');
          });
      })
      .catch(err => console.error('Error fetching schedules:', err));

    // Submit the selected team
    submitButton.addEventListener('click', () => {
      const username = usernameField.value;
      if (selectedTeam && username) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, team: selectedTeam })
        }).then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(`You picked ${selectedTeam}`);
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              const selectedDiv = Array.from(document.querySelectorAll('.team')).find(t => t.textContent === selectedTeam);
              if (selectedDiv) {
                selectedDiv.classList.add('selected');
              }
              selectedTeam = null;
              submitButton.disabled = true;
            } else {
              alert(data.message);
            }
          });
      }
    });
  </script>
</body>
</html>
