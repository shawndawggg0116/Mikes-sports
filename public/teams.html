<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
    h1 {
      color: #333;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .team.selected {
      background-color: #007bff;
      color: white;
    }
    .team.disabled {
      background-color: red;
      cursor: not-allowed;
    }
    .team.picked {
      text-decoration: line-through;
    }
    .team.glowing {
      animation: glow 2s infinite alternate;
      background-color: yellow;
      color: black;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    @keyframes glow {
      from {
        box-shadow: 0 0 10px yellow;
      }
      to {
        box-shadow: 0 0 30px yellow;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    async function loadTeams() {
      try {
        const [gameResponse, userResponse] = await Promise.all([
          fetch('/api/game-status'),
          fetch(`/api/user-picks/${document.getElementById('username').value}`)
        ]);

        if (!gameResponse.ok || !userResponse.ok) {
          throw new Error('Failed to fetch data');
        }

        const games = await gameResponse.json();
        const { pickedTeams } = await userResponse.json();

        const now = new Date();
        const teamList = document.querySelector('.team-list');
        teamList.innerHTML = ''; // Clear previous teams to prevent duplication

        const allTeams = [
          'Cardinals', 'Falcons', 'Ravens', 'Bills', 'Panthers', 'Bears', 'Bengals',
          'Browns', 'Cowboys', 'Broncos', 'Lions', 'Packers', 'Texans', 'Colts',
          'Jaguars', 'Chiefs', 'Raiders', 'Chargers', 'Rams', 'Dolphins', 'Vikings',
          'Patriots', 'Saints', 'Giants', 'Jets', 'Eagles', 'Steelers', '49ers',
          'Seahawks', 'Buccaneers', 'Titans', 'Commanders'
        ];

        const gameMap = new Map();
        games.forEach(game => {
          gameMap.set(game.teamA, game);
          gameMap.set(game.teamB, game);
        });

        allTeams.forEach(team => {
          const teamDiv = document.createElement('div');
          teamDiv.textContent = team;
          teamDiv.className = 'team';

          if (pickedTeams.includes(team)) {
            teamDiv.classList.add('picked', 'disabled'); // Style user-picked teams
          }

          const game = gameMap.get(team);
          if (game) {
            const startTime = new Date(game.startTime);
            const endTime = new Date(game.endTime);

            if (now >= startTime && now <= endTime) {
              teamDiv.classList.add('glowing'); // Highlight live games
            } else if (now > endTime) {
              teamDiv.classList.add('disabled'); // Mark completed games
            }
          }

          teamDiv.addEventListener('click', (event) => {
            if (!event.target.classList.contains('disabled')) {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              event.target.classList.add('selected');
              document.getElementById('submitButton').disabled = false;
            }
          });

          teamList.appendChild(teamDiv);
        });
      } catch (error) {
        console.error('Error loading teams:', error);
      }
    }

    fetch('/login', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ username, password })
})
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      sessionStorage.setItem('userId', data.userId); // Store userId after login
      window.location.href = '/teams'; // Redirect to team selection page
    } else {
      alert('Login failed: ' + data.message);
    }
  });

  const userId = sessionStorage.getItem('userId');
if (userId) {
  fetch(`/api/user-picks/${userId}`)
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        console.log('User picks:', data.pickedTeams);
        // Update the UI with the user's picked teams
      } else {
        console.error('Error fetching picks:', data.message);
      }
    });
} else {
  console.error('User ID not found. Please log in again.');
  window.location.href = '/';
}


    document.addEventListener('DOMContentLoaded', () => {
      fetch('/get-logged-in-user')
        .then(response => response.json())
        .then(data => {
          document.getElementById('username').value = data.username;
          loadTeams();
          setInterval(loadTeams, 30000); // Auto-refresh every 30 seconds
        })
        .catch(err => {
          console.error('Error fetching username:', err);
          alert('Error: Unable to fetch logged-in user.');
        });
    });
  </script>
</body>
</html>
