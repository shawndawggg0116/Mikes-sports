<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
    }
    .team-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .team {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
    .team.available {
      background-color: green;
      color: white;
    }
    .team.playing {
      background-color: yellow;
      color: black;
    }
    .team.played {
      background-color: gray;
      color: white;
    }
    .team.red {
      background-color: red;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div id="errorMessage" style="color: red; display: none;">Error loading teams. Please try again later.</div>
  <div class="team-list" id="teamList"></div>

  <script>
    async function loadTeams() {
      const teamList = document.getElementById('teamList');
      const errorMessage = document.getElementById('errorMessage');

      try {
        const response = await fetch('/nfl-teams');
        if (!response.ok) {
          throw new Error('Failed to fetch teams.');
        }

        const teams = await response.json();
        if (teams.length === 0) {
          throw new Error('No teams available.');
        }

        teams.forEach(team => {
          const div = document.createElement('div');
          div.textContent = `${team.teamName} (Wins: ${team.wins}, Losses: ${team.losses})`;
          div.className = `team ${team.status}`;
          div.onclick = () => alert(`You selected ${team.teamName}`);
          teamList.appendChild(div);
        });
      } catch (error) {
        console.error('Error:', error.message);
        errorMessage.style.display = 'block';
      }
    }

    loadTeams();
  </script>
</body>
</html>
