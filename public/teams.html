<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('background.png');
      background-size: cover;
    }
    .team {
      padding: 10px 20px;
      border-radius: 5px;
      margin: 5px;
      cursor: pointer;
      color: white;
    }
    .team.upcoming { background-color: #4caf50; }
    .team.live { background-color: #007bff; }
    .team.completed { background-color: grey; }
  </style>
</head>
<body>
  <h1>Select Your Team</h1>
  <div id="teamList"></div>
  <button id="submitButton" disabled>Submit</button>
  <script>
    const teamListElement = document.getElementById('teamList');
    const submitButton = document.getElementById('submitButton');
    let selectedTeam = null;

    // Fetch team statuses
    fetch('/teams')
      .then(response => response.json())
      .then(data => {
        const teamStatus = data.teamStatus;

        for (const team in teamStatus) {
          const status = teamStatus[team];
          const div = document.createElement('div');
          div.textContent = team;
          div.classList.add('team', status);

          div.addEventListener('click', () => {
            if (status === 'upcoming') {
              document.querySelectorAll('.team').forEach(t => t.classList.remove('selected'));
              div.classList.add('selected');
              selectedTeam = team;
              submitButton.disabled = false;
            }
          });

          teamListElement.appendChild(div);
        }
      });

    // Submit team selection
    submitButton.addEventListener('click', () => {
      if (selectedTeam) {
        fetch('/select-team', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: selectedTeam })
        })
        .then(response => response.json())
        .then(data => {
          alert(data.message);
          location.reload();
        });
      }
    });
  </script>
</body>
</html>
