<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Your Team</title>
  <style>
    /* Your CSS styles here */
    .team {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }

    .team.upcoming {
      background-color: green;
    }

    .team.in-progress {
      background-color: orange;
      animation: flash 1s infinite;
    }

    .team.finished {
      background-color: gray;
    }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/teams" class="active">Team Selection</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/rules">Rules</a>
  </div>

  <h1>Select Your Team</h1>
  <div class="team-list"></div>
  <input type="hidden" id="username" value="">
  <button id="submitButton" disabled>Submit</button>

  <script>
    const socket = io(); 

    const teamList = document.querySelector('.team-list');
    const submitButton = document.getElementById('submitButton');
    const usernameField = document.getElementById('username');

    // ... (rest of your existing code)

    // Handle game status updates from the server
    socket.on('gameStatusUpdate', (data) => {
      const teamDiv = document.querySelector(`[data-game-id="${data.gameId}"]`); 
      if (teamDiv) {
        teamDiv.classList.remove('upcoming', 'in-progress', 'finished');
        teamDiv.classList.add(data.status);
      }
    });

  </script>
</body>
</html>
