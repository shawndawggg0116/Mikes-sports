<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Schedule</title>
  <link rel="stylesheet" href="/navbar.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f0f8ff;
    }
    .navbar {
      background-color: #4CAF50;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
    }
    .navbar a {
      text-decoration: none;
      color: white;
      padding: 14px 20px;
      display: block;
    }
    .navbar a.active {
      background-color: #045d4a;
    }
    .navbar a:hover {
      background-color: #3e8e41;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #schedule-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .game {
      margin-bottom: 20px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .game p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/rules">Rules</a>
    <a href="/schedule" class="active">NFL Schedule</a>
  </div>
  <h1>NFL Schedule</h1>
  <div id="schedule-container">
    <p>Loading schedule...</p>
  </div>
  <script>
    // Fetch NFL schedule from the server
    fetch('/api/nfl-schedule')
      .then(response => response.json())
      .then(data => {
        const scheduleContainer = document.getElementById('schedule-container');
        scheduleContainer.innerHTML = ''; // Clear loading text

        if (data.length === 0) {
          scheduleContainer.innerHTML = '<p>No schedule data available.</p>';
          return;
        }

        data.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.className = 'game';
          gameDiv.innerHTML = `
            <p><strong>Week ${game.week}</strong>: ${game.team1} vs ${game.team2}</p>
            <p><strong>Start:</strong> ${new Date(game.startTime).toLocaleString()}</p>
            <p><strong>End:</strong> ${new Date(game.endTime).toLocaleString()}</p>
          `;
          scheduleContainer.appendChild(gameDiv);
        });
      })
      .catch(err => {
        document.getElementById('schedule-container').innerHTML = '<p>Error loading schedule.</p>';
        console.error(err);
      });
  </script>
</body>
</html>
