<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Schedule</title>
  <link rel="stylesheet" href="/navbar.css">
</head>
<body>
  <div class="navbar">
    <a href="/rules">Rules</a>
    <a href="/schedule" class="active">NFL Schedule</a>
  </div>
  <h1>NFL Schedule</h1>
  <div id="schedule-container">
    <p>Loading schedule...</p>
  </div>
  <script>
    // Fetch NFL schedule from the server
    fetch('/api/nfl-schedule')
      .then(response => response.json())
      .then(data => {
        const scheduleContainer = document.getElementById('schedule-container');
        scheduleContainer.innerHTML = ''; // Clear loading text

        data.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.className = 'game';
          gameDiv.innerHTML = `
            <p><strong>Week ${game.week}</strong>: ${game.team1} vs ${game.team2}</p>
            <p><strong>Start:</strong> ${new Date(game.startTime).toLocaleString()}</p>
            <p><strong>End:</strong> ${new Date(game.endTime).toLocaleString()}</p>
          `;
          scheduleContainer.appendChild(gameDiv);
        });
      })
      .catch(err => {
        document.getElementById('schedule-container').innerHTML = '<p>Error loading schedule.</p>';
        console.error(err);
      });
  </script>
</body>
</html>
