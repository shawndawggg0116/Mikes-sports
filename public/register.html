<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .register-container { margin-top: 50px; }
        .register-form { display: inline-block; text-align: left; }
        .register-form input { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        .register-form button { padding: 10px; background: #007BFF; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Register User</h1>
        <form class="register-form" id="register-form">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Register</button>
        </form>
        <p id="message" style="color: red; display: none;">Error: Registration failed!</p>
    </div>
    <script>
        const form = document.getElementById('register-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const result = await response.json();
            if (result.success) {
                alert('Registration successful! Redirecting to login...');
                window.location.href = '/'; // Redirect to login
            } else {
                document.getElementById('message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
