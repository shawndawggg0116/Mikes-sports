<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .form-container {
      margin: 20px auto;
      width: 50%;
      text-align: left;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-container label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    .form-container select, .form-container input, .form-container button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .form-container button {
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  <div class="form-container">
    <h2>Manage Users</h2>
    <!-- Dropdown to Update Points -->
    <form id="updatePointsForm">
      <label for="userDropdown">Select User:</label>
      <select id="userDropdown" name="username" required>
        <!-- Users will be dynamically populated -->
      </select>
      <label for="pointsInput">Enter Points:</label>
      <input type="number" id="pointsInput" name="points" min="0" required>
      <button type="submit">Update Points</button>
    </form>

    <!-- Dropdown to Delete Users -->
    <form id="deleteUserForm">
      <label for="deleteUserDropdown">Select User to Delete:</label>
      <select id="deleteUserDropdown" name="username" required>
        <!-- Users will be dynamically populated -->
      </select>
      <button type="submit">Delete User</button>
    </form>

    <!-- Dropdown to Unlock Teams -->
    <form id="unlockTeamForm">
      <label for="unlockUserDropdown">Select User:</label>
      <select id="unlockUserDropdown" name="username" required>
        <!-- Users will be dynamically populated -->
      </select>
      <label for="teamDropdown">Select Team to Unlock:</label>
      <select id="teamDropdown" name="team">
        <option value="">-- Select a Team --</option>
        <option value="Cardinals">Cardinals</option>
        <option value="Falcons">Falcons</option>
        <option value="Ravens">Ravens</option>
        <option value="Bills">Bills</option>
        <option value="Panthers">Panthers</option>
        <option value="Bears">Bears</option>
        <option value="Bengals">Bengals</option>
        <option value="Browns">Browns</option>
        <option value="Cowboys">Cowboys</option>
        <option value="Broncos">Broncos</option>
        <option value="Lions">Lions</option>
        <option value="Packers">Packers</option>
        <option value="Texans">Texans</option>
        <option value="Colts">Colts</option>
        <option value="Jaguars">Jaguars</option>
        <option value="Chiefs">Chiefs</option>
        <option value="Raiders">Raiders</option>
        <option value="Chargers">Chargers</option>
        <option value="Rams">Rams</option>
        <option value="Dolphins">Dolphins</option>
        <option value="Vikings">Vikings</option>
        <option value="Patriots">Patriots</option>
        <option value="Saints">Saints</option>
        <option value="Giants">Giants</option>
        <option value="Jets">Jets</option>
        <option value="Eagles">Eagles</option>
        <option value="Steelers">Steelers</option>
        <option value="49ers">49ers</option>
        <option value="Seahawks">Seahawks</option>
        <option value="Buccaneers">Buccaneers</option>
        <option value="Titans">Titans</option>
        <option value="Commanders">Commanders</option>
      </select>
      <button type="submit">Unlock Team</button>
    </form>

    <!-- Unlock All Teams -->
    <form id="unlockAllTeamsForm">
      <button type="submit">Unlock All Teams</button>
    </form>
  </div>

  <script>
    // Fetch all users and populate dropdowns
    fetch('/admin/users')
      .then(response => response.json())
      .then(users => {
        const userDropdown = document.getElementById('userDropdown');
        const deleteUserDropdown = document.getElementById('deleteUserDropdown');
        const unlockUserDropdown = document.getElementById('unlockUserDropdown');

        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user.username;
          option.textContent = user.username;

          // Add to all dropdowns
          userDropdown.appendChild(option.cloneNode(true));
          deleteUserDropdown.appendChild(option.cloneNode(true));
          unlockUserDropdown.appendChild(option.cloneNode(true));
        });
      });

    // Form Submission Handlers
    document.getElementById('updatePointsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('userDropdown').value;
      const points = document.getElementById('pointsInput').value;

      fetch('/admin/update-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, points })
      }).then(response => response.text())
        .then(alert);
    });

    document.getElementById('deleteUserForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('deleteUserDropdown').value;

      fetch('/admin/delete-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      }).then(response => response.text())
        .then(alert);
    });

    document.getElementById('unlockTeamForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('unlockUserDropdown').value;
      const team = document.getElementById('teamDropdown').value;

      fetch('/admin/unlock-teams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, team })
      }).then(response => response.text())
        .then(alert);
    });

    document.getElementById('unlockAllTeamsForm').addEventListener('submit', function (e) {
      e.preventDefault();

      fetch('/admin/unlock-all-teams', {
        method: 'POST'
      }).then(response => response.text())
        .then(alert);
    });
  </script>
</body>
</html>
