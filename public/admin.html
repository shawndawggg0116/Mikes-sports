<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js" crossorigin="anonymous"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
      background-color: #d2b48c; /* Light brown */
      color: black; 
    }

    .container {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: darkred;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: red;
    }

    .teams-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    .teams-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .team-card {
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      flex: 1 1 calc(25% - 20px);
      box-sizing: border-box;
    }

    .button {
      padding: 10px 20px;
      margin: 5px;
      color: white;
      border: none;
      cursor: pointer;
    }

    .active {
      background-color: #28a745; /* Green for active win */
      border: 2px solid darkgreen; /* Optional: add a border to highlight */
    }

    .active-loss {
      background-color: #040d66; /* Dark blue for active loss */
      border: 2px solid navy; /* Optional: add a border to highlight */
    }

    .week-selector {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  
  <!-- Week Selector -->
  <div class="week-selector">
    <label for="week-select">Select Week:</label>
    <select id="week-select" onchange="updateWeek()">
      <!-- Week options will be dynamically inserted here -->
    </select>
  </div>

  <div class="container">
    <h3>Register User</h3>
    <label for="newUsername">Username:</label>
    <input type="text" id="newUsername" placeholder="Enter username">
    
    <label for="newPassword">Password:</label>
    <input type="password" id="newPassword" placeholder="Enter password">
    
    <label for="userRole">Role:</label>
    <select id="userRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    
    <button onclick="registerUser()">Register</button>
  </div>

  <div class="container">
    <h3>Delete User</h3>
    <label for="userList">Select User:</label>
    <select id="userList">
      <option value="">Loading users...</option>
    </select>
    <button onclick="deleteUser()">Delete</button>
  </div>

  <div class="teams-container" id="teams-container">
    <h3>Teams for Week <span id="current-week"></span></h3>
    <div class="teams-list" id="teams-list">
      <!-- Teams will be dynamically inserted here -->
    </div>
    <button id="submit-results">Submit Results</button>
  </div>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect if not logged in
    }

    const authHeader = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    // Register a new user with role selection
    async function registerUser() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const role = document.getElementById('userRole').value;

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: authHeader,
          body: JSON.stringify({ username, password, role })
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
          fetchUsers(); // Refresh user list
        }
      } catch (error) {
        console.error("Error registering user:", error);
        alert("Failed to register user.");
      }
    }

    async function fetchTeams() {
  const week = document.getElementById('week-select').value;
  try {
    console.log('Attempting to fetch teams for admin for week:', week);
    const response = await fetch(`/api/teams-for-admin-week/${week}`, { headers: authHeader });
    console.log('Fetch response status:', response.status);
    if (!response.ok) {
      const errorText = await response.text(); // Get the error message from the server if any
      console.error('Fetch response error:', errorText);
      throw new Error(`Failed to fetch teams for admin for week ${week}. Status: ${response.status}, Error: ${errorText}`);
    }

    const data = await response.json();
    console.log('Fetched teams data for admin:', data);

    const teamsList = document.getElementById('teams-list');
    teamsList.innerHTML = "";

    if (data.length === 0) {
      teamsList.innerHTML = `<p>No teams found.</p>`;
      console.log('No teams found in the database for admin for week:', week);
    } else {
      data.forEach(team => {
        const teamCard = document.createElement('div');
        teamCard.className = 'team-card';
        teamCard.innerHTML = `
          <span>${team.name}</span>
          <div>
            <button class="win-btn" data-team="${team.name}">Win</button>
            <button class="loss-btn" data-team="${team.name}">Loss</button>
          </div>
        `;
        teamsList.appendChild(teamCard);
      });
      console.log('Teams added to the list for admin for week:', week);
    }
  } catch (error) {
    console.error("Error fetching teams for admin:", error);
    alert("Failed to load teams for admin. Please check console for details.");
  }
}

    // Function to handle the result submission
    async function submitResults() {
      try {
        const winButtons = document.querySelectorAll('.win-btn');
        const results = [];

        winButtons.forEach(button => {
          const teamName = button.getAttribute('data-team');
          const isWin = button.classList.contains('active');
          results.push({ team: teamName, result: isWin ? 'win' : 'loss' });
        });

        const response = await fetch('/api/update-results', {
          method: 'POST',
          headers: {
            ...authHeader,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ results })
        });

        if (!response.ok) throw new Error('Failed to update results');
        alert('Results updated successfully');
        // Optionally, refresh the page or fetch teams again to reflect changes
      } catch (error) {
        console.error("Error submitting results:", error);
        alert("Failed to update results.");
      }
    }

    // Event listeners for win/loss buttons
    document.getElementById('teams-container').addEventListener('click', function(e) {
      if (e.target.classList.contains('win-btn') || e.target.classList.contains('loss-btn')) {
        // Toggle 'active' class on clicked button
        e.target.classList.toggle('active');
        
        // Ensure that only one button can be active at a time: either win or loss
        const siblingButton = e.target.parentElement.querySelector(
          e.target.classList.contains('win-btn') ? '.loss-btn' : '.win-btn'
        );
        
        // Remove 'active' class from the sibling button if present
        siblingButton.classList.remove('active');
      }
    });

    // Event listener for submit button
    document.getElementById('submit-results').addEventListener('click', submitResults);

    // Delete user by ID
    async function deleteUser() {
      const userDropdown = document.getElementById('userList');
      const userId = userDropdown.value;

      if (!userId) {
        alert("Please select a user to delete.");
        return;
      }

      if (!confirm("Are you sure you want to delete this user?")) {
        return;
      }

      try {
        const response = await fetch(`/api/delete-user/${userId}`, {
          method: 'DELETE',
          headers: authHeader,
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
          fetchUsers(); // Refresh dropdown after deletion
        }
      } catch (error) {
        console.error("Error deleting user:", error);
        alert("Failed to delete user.");
      }
    }

    async function fetchUsers() {
      try {
        const response = await fetch('/api/all-users-data', { headers: authHeader });
        if (!response.ok) throw new Error('Failed to fetch users');

        const data = await response.json();
        const userList = document.getElementById('userList');
        userList.innerHTML = '<option value="">Select User</option>'; // Reset the dropdown

        if (data.success && data.users) {
          data.users.forEach(user => {
            const option = document.createElement('option');
            option.value = user._id;
            option.textContent = user.username;
            userList.appendChild(option);
          });
        } else {
          throw new Error('Failed to load user data');
        }
      } catch (error) {
        console.error("Error fetching users:", error);
        alert("Failed to load users.");
      }
    }

    // Function to populate the week selector
    function populateWeekSelector() {
      const currentWeek = moment().isoWeek();
      const select = document.getElementById('week-select');
      for (let i = 1; i <= currentWeek; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Week ${i}`;
        select.appendChild(option);
      }
      select.value = currentWeek; // Set to current week by default
      document.getElementById('current-week').textContent = currentWeek;
      fetchTeams(); // Fetch teams for the current week initially
    }

    // Function to update week when selection changes
    function updateWeek() {
      const selectedWeek = document.getElementById('week-select').value;
      document.getElementById('current-week').textContent = selectedWeek;
      fetchTeams(); // Fetch teams for the newly selected week
    }

    // Fetch teams, users, and populate week selector when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      fetchTeams();
      fetchUsers();
      populateWeekSelector();
    });
  </script>
</body>
</html>
