<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
      background-color: #d2b48c; /* Light brown */
      color: black; 
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: darkred;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: red;
    }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  
  <div class="container">
    <h3>Register User</h3>
    <label for="newUsername">Username:</label>
    <input type="text" id="newUsername" placeholder="Enter username">
    
    <label for="newPassword">Password:</label>
    <input type="password" id="newPassword" placeholder="Enter password">
    
    <label for="userRole">Role:</label>
    <select id="userRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    
    <button onclick="registerUser()">Register</button>
  </div>

  <div class="container">
    <h3>Delete User</h3>
    <label for="userList">Select User:</label>
    <select id="userList">
      <option value="">Loading users...</option>
    </select>
    <button onclick="deleteUser()">Delete</button>
  </div>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect if not logged in
    }

    const authHeader = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    // Register a new user
    async function registerUser() {
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('userRole').value;

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: authHeader,
          body: JSON.stringify({ username, password, role })
        });

        const result = await response.json();
        alert(result.message);
        if (result.success) {
          fetchUsers(); // Refresh user list
        }
      } catch (error) {
        console.error("Error registering user:", error);
        alert("Failed to register user.");
      }
    }

    // Fetch users and populate dropdown
    async function fetchUsers() {
      try {
        const response = await fetch('/api/users', { headers: authHeader });
        if (!response.ok) throw new Error("Failed to fetch users");

        const users = await response.json();
        console.log("Fetched Users:", users); // Debugging log

        const userDropdown = document.getElementById('userList');
        userDropdown.innerHTML = ""; 

        if (users.length === 0) {
          userDropdown.innerHTML = `<option value="">No users found</option>`;
          return;
        }

        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user._id;
          option.textContent = `${user.username} (${user.role})`;
          userDropdown.appendChild(option);
        });
      } catch (error) {
        console.error("Error fetching users:", error);
        alert("Failed to load users.");
      }
    }

    // Delete user
    async function deleteUser() {
      const userDropdown = document.getElementById('userList');
      const userId = userDropdown.value;

      if (!userId) {
        alert("Please select a user to delete.");
        return;
      }

      if (!confirm("Are you sure you want to delete this user?")) {
        return; // Stop if the user cancels
      }

      try {
        const response = await fetch(`/api/delete-user/${userId}`, {
          method: 'DELETE',
          headers: authHeader,
        });

        const result = await response.json();
        if (result.success) {
          alert(result.message);
          fetchUsers(); // Refresh dropdown after deletion
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error("Error deleting user:", error);
        alert("Failed to delete user.");
      }
    }

    // Load users on page load
    fetchUsers();
  </script>
</body>
</html>
