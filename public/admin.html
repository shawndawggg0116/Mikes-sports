<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
      background-color: #d2b48c; /* Light brown */
      color: black; 
    }

    .container {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: darkred;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: red;
    }

    .teams-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    .teams-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .team-card {
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      flex: 1 1 calc(25% - 20px);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  
  <div class="container">
    <h3>Register User</h3>
    <label for="newUsername">Username:</label>
    <input type="text" id="newUsername" placeholder="Enter username">
    
    <label for="newPassword">Password:</label>
    <input type="password" id="newPassword" placeholder="Enter password">
    
    <label for="userRole">Role:</label>
    <select id="userRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    
    <button onclick="registerUser()">Register</button>
  </div>

  <div class="container">
    <h3>Delete User</h3>
    <label for="userList">Select User:</label>
    <select id="userList">
      <option value="">Loading users...</option>
    </select>
    <button onclick="deleteUser()">Delete</button>
  </div>

  <div class="teams-container">
    <h3>All Teams</h3>
    <div class="teams-list" id="teams-list">
      <!-- Teams will be dynamically inserted here -->
    </div>
  </div>
  
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect if not logged in
    }

    const authHeader = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    // ✅ Register a new user with role selection
    async function registerUser() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const role = document.getElementById('userRole').value;

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: authHeader,
          body: JSON.stringify({ username, password, role })
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
          fetchUsers(); // Refresh user list
        }
      } catch (error) {
        console.error("Error registering user:", error);
        alert("Failed to register user.");
      }
    }

    // ✅ Fetch and display users
    async function fetchUsers() {
      try {
        const response = await fetch('/api/users', { headers: authHeader });

        if (!response.ok) {
          console.error("❌ Failed to fetch users. Server Response:", response.status);
          alert("Failed to load users.");
          return;
        }

        const data = await response.json();
        console.log("📌 API Response:", data);

        if (!data.success || !data.users) {
          console.error("⚠ API returned no users.");
          alert("No users found.");
          return;
        }

        const users = data.users;
        const userDropdown = document.getElementById('userList');
        userDropdown.innerHTML = ""; // Clear existing options

        if (users.length === 0) {
          userDropdown.innerHTML = `<option value="">No users found</option>`;
          return;
        }

        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user._id;
          option.textContent = `${user.username} (${user.role})`;
          userDropdown.appendChild(option);
        });

        console.log("✅ Users added to dropdown.");
      } catch (error) {
        console.error("❌ Error fetching users:", error);
        alert("Failed to load users.");
      }
    }

    // ✅ Delete user by ID
    async function deleteUser() {
      const userDropdown = document.getElementById('userList');
      const userId = userDropdown.value;

      if (!userId) {
        alert("Please select a user to delete.");
        return;
      }

      if (!confirm("Are you sure you want to delete this user?")) {
        return;
      }

      try {
        const response = await fetch(`/api/delete-user/${userId}`, {
          method: 'DELETE',
          headers: authHeader,
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
          fetchUsers(); // Refresh dropdown after deletion
        }
      } catch (error) {
        console.error("Error deleting user:", error);
        alert("Failed to delete user.");
      }
    }

    // ✅ Fetch and display all teams
    async function fetchTeams() {
      try {
        const response = await fetch('/api/teams', { headers: authHeader });

        if (!response.ok) {
          console.error("❌ Failed to fetch teams. Server Response:", response.status);
          alert("Failed to load teams.");
          return;
        }

        const data = await response.json();
        console.log("📌 Teams API Response:", data);

        if (!data.success || !data.teams) {
          console.error("⚠ API returned no teams.");
          alert("No teams found.");
          return;
        }

        const teams = data.teams;
        const teamsList = document.getElementById('teams-list');
        teamsList.innerHTML = ""; // Clear existing content

        if (teams.length === 0) {
          teamsList.innerHTML = `<p>No teams found.</p>`;
          return;
        }

        teams.forEach(team => {
          const teamCard = document.createElement('div');
          teamCard.className = 'team-card';
          teamCard.textContent = team.name;
          teamsList.appendChild(teamCard);
        });

        console.log("✅ Teams added to the list.");
      } catch (error) {
        console.error("❌ Error fetching teams:", error);
        alert("Failed to load teams.");
      }
    }

    // Load users and teams on page load
    fetchUsers();
    fetchTeams();
  </script>
</body>
</html>
