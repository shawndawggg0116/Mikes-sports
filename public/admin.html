<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
      background-color: #d2b48c; /* Light brown */
      color: black; 
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: darkred;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: red;
    }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  
  <div class="container">
    <h3>Register User</h3>
    <label for="newUsername">Username:</label>
    <input type="text" id="newUsername" placeholder="Enter username">
    
    <label for="newPassword">Password:</label>
    <input type="password" id="newPassword" placeholder="Enter password">
    
    <label for="userRole">Role:</label>
    <select id="userRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    
    <button onclick="registerUser()">Register</button>
  </div>

  <div class="container">
    <h3>Update Team Results</h3>
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>Win</th>
          <th>Lose</th>
        </tr>
      </thead>
      <tbody id="teamsTable"></tbody>
    </table>
    <button onclick="submitResults()">Submit Results</button>
  </div>
  

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/'; // Redirect if not logged in
    }

    const authHeader = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

    async function fetchTeams() {
  try {
    const response = await fetch('/api/teams', { headers: authHeader });
    const teams = await response.json();

    const table = document.getElementById("teamsTable");
    table.innerHTML = "";

    teams.forEach(team => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${team.name}</td>
        <td><input type="radio" name="${team.name}" value="win"></td>
        <td><input type="radio" name="${team.name}" value="lose"></td>
      `;
      table.appendChild(row);
    });

    console.log("✅ Teams loaded successfully.");
  } catch (error) {
    console.error("❌ Error fetching teams:", error);
    alert("Failed to load teams.");
  }
}

fetchTeams();

async function submitResults() {
  const results = {};

  document.querySelectorAll("tbody tr").forEach(row => {
    const teamName = row.cells[0].innerText;
    const winChecked = row.cells[1].querySelector("input").checked;
    const loseChecked = row.cells[2].querySelector("input").checked;

    if (winChecked) results[teamName] = "win";
    if (loseChecked) results[teamName] = "lose";
  });

  try {
    const response = await fetch('/api/admin/update-results', {
      method: 'POST',
      headers: authHeader,
      body: JSON.stringify({ results })
    });

    const data = await response.json();
    alert(data.message);
    fetchTeams(); // Refresh teams after update
  } catch (error) {
    console.error("❌ Error submitting results:", error);
    alert("Failed to update results.");
  }
}



    // ✅ Register a new user with role selection
    async function registerUser() {
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const role = document.getElementById('userRole').value;

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: authHeader,
          body: JSON.stringify({ username, password, role })
        });

        const result = await response.json();
        alert(result.message);

      } catch (error) {
        console.error("Error registering user:", error);
        alert("Failed to register user.");
      }
    }
  </script>
</body>
</html>
